name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

# Токен по умолчанию — только чтение; право записи выдаётся точечно тем job,
# которые публикуют релиз (REL-02). Раньше contents:write был глобальным и
# доставался в том числе build-матрице, которой запись не нужна.
permissions:
  contents: read

# Сериализация, но БЕЗ cancel-in-progress: в отличие от CI, прерывать релиз
# нельзя — отменённый прогон может оставить тег с половиной артефактов или
# опубликованный релиз без файлов. Очередь на ref: два пуша в main ждут друг
# друга, тег со своей очередью им не мешает.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    # Без явного лимита зависший раннер держит релиз и минуты организации до
    # 6-часового дефолта GitHub. Сборка одной цели укладывается в единицы минут.
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            runner: windows-latest
            ext: .exe
            archive: zip
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            ext: ''
            archive: tar
          - goos: darwin
            goarch: amd64
            runner: macos-latest
            ext: ''
            archive: tar

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: '.go-version'
          cache: true

      - name: Compute version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "ver=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "ver=build-${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w -X github.com/ivantit66/onebase/internal/version.Build=${{ steps.ver.outputs.ver }}" -o onebase${{ matrix.ext }} ./cmd/onebase

      - name: Build GUI binary (Windows native window, webview)
        if: matrix.goos == 'windows'
        shell: pwsh
        env:
          CGO_ENABLED: 1
        run: |
          go build -tags webview -ldflags="-s -w -H windowsgui -X github.com/ivantit66/onebase/internal/version.Build=${{ steps.ver.outputs.ver }}" -o onebase-gui.exe ./cmd/onebase

      - name: Package (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $name = "onebase-${{ matrix.goos }}-${{ matrix.goarch }}"
          New-Item -ItemType Directory -Name $name
          Copy-Item onebase.exe "$name\"
          Copy-Item onebase-gui.exe "$name\"
          Copy-Item README.md "$name\" -ErrorAction SilentlyContinue
          Copy-Item examples "$name\" -Recurse -ErrorAction SilentlyContinue
          Compress-Archive -Path "$name\*" -DestinationPath "${name}.zip"
          echo "ASSET=${name}.zip" >> $env:GITHUB_ENV

      - name: Package (Unix)
        if: matrix.goos != 'windows'
        run: |
          name="onebase-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir "$name"
          cp onebase "$name/"
          cp README.md "$name/" 2>/dev/null || true
          cp -r examples "$name/" 2>/dev/null || true
          tar czf "${name}.tar.gz" "$name"
          echo "ASSET=${name}.tar.gz" >> $GITHUB_ENV

      - name: Checksum (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 $env:ASSET).Hash.ToLower()
          "$hash  $env:ASSET" | Out-File -Encoding ascii "$env:ASSET.sha256"

      - name: Checksum (Unix)
        if: matrix.goos != 'windows'
        run: sha256sum "$ASSET" > "$ASSET.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: onebase-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          retention-days: 7

  # Гейт REL-02: публиковать можно только коммит, для которого основной CI
  # (ci.yml) завершился успехом. Раньше release.yml запускался независимо от
  # результата CI — красный или ещё не прогнанный коммит мог быть опубликован.
  verify-ci:
    name: Require green CI for this commit
    runs-on: ubuntu-latest
    # Свой дедлайн ожидания CI — 30 минут (см. шаг ниже); лимит job'а стоит
    # чуть выше, чтобы срабатывал внутренний с внятным сообщением, а этот
    # оставался страховкой на случай зависания самого раннера.
    timeout-minutes: 40
    permissions:
      actions: read
    steps:
      - name: Wait for CI success on this SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Ждём завершения всех прогонов workflow "CI" для ТОЧНОГО SHA и требуем,
          # чтобы каждый завершился success. Тег, коммит которого никогда не был
          # на main (CI по нему не запускался), корректно упрётся в таймаут —
          # публикация непроверенного коммита недопустима.
          deadline=$(( $(date +%s) + 1800 ))
          while :; do
            runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=100" \
              --jq '[.workflow_runs[] | {status: .status, conclusion: .conclusion}]')
            total=$(echo "$runs" | jq 'length')
            completed=$(echo "$runs" | jq '[.[] | select(.status=="completed")] | length')
            if [ "$total" -gt 0 ] && [ "$completed" -eq "$total" ]; then
              bad=$(echo "$runs" | jq '[.[] | select(.conclusion!="success")] | length')
              if [ "$bad" -eq 0 ]; then
                echo "CI зелёный для $SHA."
                exit 0
              fi
              echo "::error::CI для $SHA завершился не успехом. Публикация отменена."
              echo "$runs" | jq .
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Не дождались успешного CI для $SHA за 30 минут. Публикация отменена."
              echo "$runs" | jq .
              exit 1
            fi
            echo "Жду CI для $SHA ($completed/$total завершено)..."
            sleep 20
          done

  dev-release:
    name: Dev Pre-Release
    needs: [build, verify-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write   # публикация пре-релиза
    steps:
      # checkout нужен чтобы `git log` дал subject последнего коммита для
      # <!-- summary --> маркера. Сайт onabase.site берёт текст из этого
      # маркера для карточки релиза — без него попадает дефолтный «Автосборка…».
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute commit subject
        id: subj
        # heredoc-форма GH_OUTPUT — корректно переживает спецсимволы
        # (кавычки, обратные апострофы, эмодзи) в subject коммита.
        run: |
          {
            echo "subject<<EOF"
            git log -1 --format=%s
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: build-${{ github.run_number }}
          prerelease: true
          files: dist/*
          body: |
            <!-- summary: ${{ steps.subj.outputs.subject }} -->

            ## Что нового

            ${{ steps.subj.outputs.subject }}

            ## Сборка

            Автосборка из ветки `main`.
            Коммит: `${{ github.sha }}`
            Версия платформы: `build-${{ github.run_number }}`

            Для идентификации: в конфигураторе в шапке отображается `платформа build-${{ github.run_number }}`.

      - name: Append commit diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          # Find the previous build release
          PREV=$(gh release list --repo "${{ github.repository }}" --limit 50 --json tagName --jq '.[].tagName' \
            | grep '^build-' \
            | sed 's/build-//' \
            | sort -n \
            | awk -v cur="${{ github.run_number }}" '$1 < cur' \
            | tail -1)

          SUMMARY=""
          CHANGES=""

          if [[ -n "$PREV" ]]; then
            PREV_TAG="build-${PREV}"
            COMMITS=$(gh api "repos/${{ github.repository }}/compare/${PREV_TAG}...${TAG}" \
              --jq '.commits[] | "- \(.commit.message | split("\n")[0]) (\(.sha[0:7]))"' 2>/dev/null || true)

            if [[ -n "$COMMITS" ]]; then
              COUNT=$(echo "$COMMITS" | wc -l | tr -d ' ')
              CHANGES=$'\n\n'"## Изменения с ${PREV_TAG} (${COUNT} коммит(ов))"$'\n'"${COMMITS}"

              # Generate summary from first commit message (one line, stripped of conventional prefix)
              FIRST=$(echo "$COMMITS" | head -1 | sed 's/([^)]*)$//' | sed 's/^[- ]*//' | sed 's/<!--//g; s/-->//g')
              SUMMARY="<!-- summary: ${FIRST} -->"$'\n\n'
            fi
          fi

          # Read current body, prepend summary marker, append changes
          CURRENT=$(gh release view "$TAG" --repo "${{ github.repository }}" --json body --jq '.body')
          NEW_BODY="${SUMMARY}${CURRENT}${CHANGES}"

          gh release edit "$TAG" --repo "${{ github.repository }}" --notes "$NEW_BODY"

  release:
    name: Create GitHub Release
    needs: [build, verify-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write   # публикация релиза
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release body
        id: release_body
        shell: bash
        run: |
          notes="release_${GITHUB_REF_NAME}.md"
          if [[ -f "$notes" ]]; then
            echo "path=$notes" >> "$GITHUB_OUTPUT"
          else
            cat > release-default.md <<'EOF'
          <!-- summary: Обновление OneBase с бинарными сборками для Windows, Linux и macOS. -->

          ## Что нового

          См. автоматически сгенерированный список изменений ниже.

          ## Установка

          ### Windows
          1. Скачайте `onebase-windows-amd64.zip`
          2. Распакуйте в любую папку, например `C:\onebase\`
          3. Запустите `onebase-gui.exe`

          ### Linux / macOS
          ```bash
          tar xzf onebase-linux-amd64.tar.gz
          ./onebase-linux-amd64/onebase start
          ```

          ### Требования
          - PostgreSQL 14+ нужен только для многопользовательского режима
          - Для SQLite-режима дополнительных зависимостей нет
          EOF
            echo "path=release-default.md" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body_path: ${{ steps.release_body.outputs.path }}

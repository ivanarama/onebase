name: OneBase 2222 synthetic Linux qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: onebase-2222-synthetic-qualification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualification-2222-synthetic-linux:
    if: github.repository == 'ivanarama/onebase' && github.actor == 'ivanarama' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/operator/2222-linux-qualification-20261109' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: One synthetic qualification in one restricted cgroup
        shell: bash
        env:
          QUAL_RUN_ID: ${{ github.run_id }}
          QUAL_RUN_ATTEMPT: ${{ github.run_attempt }}
          QUAL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sudo -n /usr/bin/env -i PATH=/usr/bin:/bin PYTHONUTF8=1 \
            GITHUB_REPOSITORY=ivanarama/onebase GITHUB_ACTOR=ivanarama \
            GITHUB_EVENT_NAME=workflow_dispatch GITHUB_REF=refs/heads/operator/2222-linux-qualification-20261109 \
            GITHUB_RUN_ID="$QUAL_RUN_ID" GITHUB_RUN_ATTEMPT="$QUAL_RUN_ATTEMPT" GITHUB_SHA="$QUAL_SHA" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            /usr/bin/python3 -B -X utf8 "$GITHUB_WORKSPACE/.github/scripts/qualify-2222-linux.py" bootstrap
      - name: Preserve qualification evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-2222-synthetic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/onebase-2222-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14

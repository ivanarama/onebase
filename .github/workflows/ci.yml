name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Ручной запуск (план 115). Без него прогон нельзя перезапустить иначе как
  # новым пушем: во время аварии GitHub Actions 2026-08-06 вебхуки были
  # задушены до ~15%, PR-события прогонов не создавали, а обязательные
  # статус-чеки при этом блокируют мерж — восстановиться было нечем.
  workflow_dispatch:

# CI только читает исходники. Артефакты и кэш setup-go используют
# внутренние runtime-токены Actions и не требуют прав на репозиторий.
permissions:
  contents: read

# Отменять устаревшие прогоны того же ref (QUAL-04): новый push в ту же ветку/PR
# снимает предыдущий незавершённый прогон, чтобы зависшие/лишние runs не
# потребляли раннеры бесконечно. По ref, а не глобально, — параллельные ветки
# не мешают друг другу.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: '.go-version'
          cache: true

      - name: Check for UTF-8 BOM in .go files
        run: |
          if grep -rlI $'\xEF\xBB\xBF' --include='*.go' .; then
            echo "::error::Найдены .go файлы с UTF-8 BOM (перечислены выше). Уберите BOM — это ломает //go:build строки и засоряет diff."
            exit 1
          fi
          echo "BOM не найден — ок."

      # Полнота переводов шаблонов: тот же tools/i18ncheck, что в pre-commit
      # hook. В CI ловит непереведённые {{t}}-ключи до мержа — pre-commit
      # срабатывает только локально и обходится --no-verify (план 64: 19 ключей
      # редактора макетов просочились в main). Быстрый шаг — до тяжёлых тестов.
      - name: i18n translations check
        run: go run ./tools/i18ncheck

      - name: Lint shipped example/template configurations
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          go build -o "$tmp/onebase" ./cmd/onebase

          failed=0
          for project in examples/* templates/*; do
            [ -d "$project" ] || continue
            echo "::group::$project"
            out="$("$tmp/onebase" lint --project "$project" --json)"
            issues="$(printf '%s' "$out" | jq '(.issues // []) | length')"
            warnings="$(printf '%s' "$out" | jq '(.warnings // []) | length')"
            if [ "$issues" -ne 0 ] || [ "$warnings" -ne 0 ]; then
              echo "::error::$project has $issues issue(s) and $warnings warning(s)"
              printf '%s' "$out" | jq -r '
                (.issues // []), (.warnings // [])
                | .[]
                | "\(.file // "(конфигурация)"):\(.line // 0):\(.column // 0): [\(.kind // "")] [\(.code // "")] \(.message)"
              '
              failed=1
            else
              echo "$project: lint clean"
            fi
            echo "::endgroup::"
          done
          exit "$failed"

      # Заполнение демо-баз (issue #842). Пример — первое, что запускает новый
      # пользователь, и заполнение у него ломалось молча: `lint` разбирает
      # конфигурацию, `onebase test` гоняет объявленные тесты, а обработку
      # ЗаполнитьТестовуюБазу не запускал никто. Поломка (у табличной части в
      # обработчике проведения не было методов) прожила до тех пор, пока
      # тихий отказ не сделали слышным.
      - name: Seed shipped example databases (SQLite)
        run: |
          set -uo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          go build -o "$tmp/onebase" ./cmd/onebase
          failed=0
          for ex in trade crm finance tasks cms; do
            echo "::group::seed $ex"
            if ! "$tmp/onebase" migrate --project "examples/$ex" --sqlite "$tmp/seed-$ex.db"; then
              echo "::error::$ex: миграция не прошла"
              failed=1
              echo "::endgroup::"
              continue
            fi
            if ! "$tmp/onebase" procrun --project "examples/$ex" --sqlite "$tmp/seed-$ex.db" --proc ЗаполнитьТестовуюБазу; then
              echo "::error::$ex: заполнение демо-базы упало"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

      # Конфигурационные тесты shipped-примеров (QUAL-01, issue #790). Runner
      # `onebase test` реализован, но CI гонял для конфигураций только lint.
      # Важно: `onebase test` при НУЛЕ найденных тестов возвращает 0 — поэтому
      # гейт отдельно проверяет ненулевой план TAP (1..N, N>0), иначе «нет
      # тестов» молча считалось бы успехом.
      - name: Run shipped example config tests (SQLite)
        run: |
          set -uo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          go build -o "$tmp/onebase" ./cmd/onebase
          failed=0
          for ex in minimal callcenter trade cms; do
            echo "::group::onebase test $ex"
            out="$("$tmp/onebase" test --project "examples/$ex" --sqlite "$tmp/$ex.db" --format tap 2>&1)"; code=$?
            echo "$out"
            plan="$(printf '%s\n' "$out" | sed -n 's/^1\.\.\([0-9][0-9]*\)$/\1/p' | head -1)"
            if [ "$code" -ne 0 ]; then
              echo "::error::$ex: onebase test завершился с кодом $code (упавшие тесты)"
              failed=1
            elif [ -z "$plan" ] || [ "$plan" -eq 0 ]; then
              echo "::error::$ex: не найдено ни одного теста — ноль тестов не считается успехом (QUAL-01)"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

      # Форматирование не проверялось ничем: gofmt в гейтах не было, а в
      # .golangci.yml формат-линтеры не включены. За неделю 30.07–06.08 в main
      # утекли три файла не по формату (из #570, #595, #600) — дрейф копится
      # ровно потому, что его никто не ловит. third_party исключён: он
      # вендорный, приводить его к нашему формату незачем.
      - name: gofmt
        run: |
          unformatted="$(git ls-files '*.go' | grep -v '^third_party/' | xargs gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "::error::Файлы не отформатированы gofmt:"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt: чисто"

      - name: go vet
        run: go vet ./...

      # JavaScript не проверялся в CI ничем. Для компилятора Go это вложенные
      # статические ресурсы, поэтому синтаксическая ошибка в configurator.js
      # (4352 строки) прошла бы все гейты зелёными — а в браузере SyntaxError
      # отменяет весь файл вместе со всеми обработчиками, то есть конфигуратор
      # просто не открывается (issue #684). Синтаксис — не всё, но именно он
      # отделяет «кнопка работает иначе» от «страница не работает вовсе».
      #
      # node предустановлен на ubuntu-latest, ставить нечего. Вендоренные бандлы
      # (webassets, rapidoc, third_party) исключены — они не наши.
      - name: JS syntax check
        run: |
          set -eu
          command -v node >/dev/null || { echo "::error::node не найден на раннере"; exit 1; }
          js="$(git ls-files '*.js' | grep -vE '^third_party/|^internal/webassets/|^internal/ui/rapidoc/')"
          [ -n "$js" ] || { echo "::error::не найдено ни одного .js — сломан отбор файлов"; exit 1; }
          n=0
          for f in $js; do
            case "$f" in
              # Сценарии k6 — ES-модули (import из 'k6/http'); у node режим
              # модуля включается расширением, поэтому проверяем через копию.
              loadtest/*) cp "$f" "${RUNNER_TEMP:-/tmp}/jscheck.mjs"
                          node --check "${RUNNER_TEMP:-/tmp}/jscheck.mjs" \
                            || { echo "::error file=$f::синтаксическая ошибка"; exit 1; } ;;
              *)          node --check "$f" \
                            || { echo "::error file=$f::синтаксическая ошибка"; exit 1; } ;;
            esac
            n=$((n+1))
          done
          echo "JS syntax: чисто ($n файлов)"

      # Отбор по `git ls-files '*.js'` физически не видит inline-<script> внутри
      # Go-шаблонов — а они там есть, и #758 добавил ещё один. Для компилятора
      # Go это текст, поэтому ошибка в шаблонном JS проходит все гейты зелёной
      # и всплывает у пользователя пустой страницей (#879, класс #684).
      - name: Inline JS syntax check (Go templates)
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP:-/tmp}/inline-js"
          rm -rf "$tmp"
          # Сам экстрактор исключён: в его регулярках лежит литерал <script…>,
          # и гейт нашёл бы «сломанный скрипт» в собственном исходнике.
          set +e
          git grep -l -z '<script' -- '*.go' > "$tmp.go-files"
          grep_status=$?
          set -e
          [ "$grep_status" -eq 0 ] || { echo "::error::не удалось отобрать Go-шаблоны с <script> (git grep: $grep_status)"; exit 1; }
          files=()
          while IFS= read -r -d '' file; do
            [[ "$file" == *_test.go || "$file" == tools/jsextract/* ]] && continue
            files+=("$file")
          done < "$tmp.go-files"
          [ "${#files[@]}" -gt 0 ] || { echo "::error::не найдено ни одного шаблона с <script> — сломан отбор"; exit 1; }
          # jsextract сам падает, если не извлёк ни одного блока: пустая выдача
          # означала бы не «чисто», а сломанный экстрактор.
          go run ./tools/jsextract -out "$tmp" "${files[@]}"
          shopt -s nullglob
          scripts=("$tmp"/*.js "$tmp"/*.mjs)
          [ "${#scripts[@]}" -gt 0 ] || { echo "::error::экстрактор не создал файлов для проверки"; exit 1; }
          n=0
          for f in "${scripts[@]}"; do
            node --check "$f" || {
              echo "::error::синтаксическая ошибка в inline-скрипте; источник — в первой строке $f"
              head -1 "$f"
              exit 1
            }
            n=$((n+1))
          done
          echo "Inline JS syntax: чисто ($n блоков)"


      # -race на Linux работает без CGo-плясок (на Windows нужен gcc) и ловит
      # гонки разделяемого интерпретатора и других синглтонов (план 52/56).
      # Coverage собирается тем же прогоном, чтобы не гонять тесты дважды.
      - name: Unit tests (-race, coverage)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      # Раннеры работают в UTC, поэтому целый класс дефектов «время
      # канонизируется не в той зоне» для CI невидим: #945 поймали случайно, на
      # локальном прогоне в Europe/Moscow. Прогоняем пакеты, где время
      # обрабатывается, ещё раз в зоне, которая ловит больше — +05:30 отличается
      # от UTC и смещением, и получасом, так что промахи на границе суток и
      # округлении часа видны сразу. Москвы для этого мало: тест, красный в
      # Дубае и Индии, в ней остаётся зелёным (#962).
      - name: Unit tests (восточная зона)
        env:
          TZ: Asia/Kolkata
        run: go test -count=1 ./internal/storage/ ./internal/query/ ./internal/entityservice/ ./internal/ui/

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -5

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

      - name: Build (check compile)
        env:
          CGO_ENABLED: 0
        run: go build ./...

      # Windows-специфичный код (//go:build windows) до плана 115 не
      # компилировался в CI вообще: сборка идёт на linux, а windows-цель
      # собиралась только в release.yml — то есть поломка вскрывалась на
      # релизе. Кросс-компиляция без CGo проверяет ровно это и стоит секунды.
      #
      # Код под -tags webview сюда не входит: webview_go требует CGo, и при
      # CGO_ENABLED=0 все его файлы исключаются («build constraints exclude
      # all Go files»). Его отдельно компилирует launcher-webview-build ниже.
      - name: Build (windows, check compile)
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: amd64
        run: go build ./...

  # Native close handling lives behind both Windows and CGo build constraints.
  # A release-only check discovers launcher-window regressions too late; compile
  # the actual GUI target and run its tagged unit tests on every PR.
  launcher-webview-build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: '.go-version'
          cache: true
      - name: Build launcher GUI (Windows WebView2)
        shell: pwsh
        env:
          CGO_ENABLED: 1
        run: go build -tags webview -o "$env:RUNNER_TEMP\onebase-gui.exe" ./cmd/onebase

      - name: Test launcher GUI state (Windows WebView2)
        shell: pwsh
        env:
          CGO_ENABLED: 1
        run: go test -count=1 -tags webview ./internal/launcher

  # Ни один гейт не запускал СОБРАННЫЙ бинарь — поэтому регрессия «сборки
  # 783–792 не запускаются вне %USERPROFILE%» прошла зелёный CI и уехала к
  # клиенту (P0 #798, план 122A). Компиляция и юнит-тесты этот класс не ловят
  # по построению: падает не код, а запуск в конкретном каталоге.
  #
  # Ключевое здесь — вторая ячейка матрицы location. Прогон только из
  # приватного каталога воспроизводит ровно тот случай, который и так работал;
  # дефект виден лишь из ОБЩЕГО каталога вне дерева пользователя.
  smoke_matrix:
    name: Smoke ${{ matrix.os }} / ${{ matrix.location }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        location: [private, shared]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: '.go-version'
          cache: true

      - name: Build binary
        shell: bash
        run: go build -o "$RUNNER_TEMP/onebase${{ runner.os == 'Windows' && '.exe' || '' }}" ./cmd/onebase

      # Приватный каталог — контроль (так работало всегда), общий — собственно
      # проверка. Каталоги создаются заранее и вне репозитория: запуск из
      # рабочей копии не воспроизводит ни одного из двух случаев.
      - name: Place binary
        shell: bash
        run: |
          set -eu
          if [ "${{ matrix.location }}" = "private" ]; then
            dir="$HOME/.onebase/bin"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            dir="/c/ob-smoke"
          else
            dir="/opt/onebase"
          fi
          mkdir -p "$dir" 2>/dev/null || sudo mkdir -p "$dir"
          if [ ! -w "$dir" ]; then sudo chown "$(id -u):$(id -g)" "$dir"; fi
          ext=""
          [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          cp "$RUNNER_TEMP/onebase$ext" "$dir/onebase$ext"
          echo "SMOKE_BIN=$dir/onebase$ext" >> "$GITHUB_ENV"

      - name: Version of the placed binary
        shell: bash
        run: |
          "$SMOKE_BIN" --version

      # Сам smoke: поднять лаунчер, дождаться ответа 200 и завершить его через
      # /quit — так одинаково работает на обеих ОС (сигналы на Windows из bash
      # доставляются ненадёжно). Проверяется и код возврата: «поднялся и
      # свалился при выходе» — тоже отказ.
      - name: Start, serve, quit
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/smoke.log"
          pid=""
          origin=""

          # На любой ранней ошибке (адрес не напечатан, GET не поднялся,
          # /quit отказал) процесс не должен остаться жить до конца job.
          cleanup() {
            status=$?
            set +e
            trap - EXIT INT TERM
            if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then
              if [ -n "$origin" ]; then
                curl --connect-timeout 2 --max-time 5 -sS -o /dev/null -X POST "$origin/quit"
              fi
              for _ in $(seq 1 5); do
                kill -0 "$pid" 2>/dev/null || break
                sleep 1
              done
              if kill -0 "$pid" 2>/dev/null; then
                kill "$pid" 2>/dev/null
                sleep 1
              fi
              if kill -0 "$pid" 2>/dev/null; then
                kill -9 "$pid" 2>/dev/null
              fi
              wait "$pid" 2>/dev/null
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          cd "$(dirname "$SMOKE_BIN")"
          ONEBASE_NO_GUI=1 "$SMOKE_BIN" start > "$log" 2>&1 &
          pid=$!

          url=""
          prefix="Лаунчер доступен по адресу: "
          for _ in $(seq 1 60); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::процесс завершился, не открыв порт:"; cat "$log"; exit 1
            fi
            line="$(grep -m1 "^${prefix}" "$log" || true)"
            url="${line#"$prefix"}"
            [ -n "$url" ] && break
            sleep 1
          done
          [ -n "$url" ] || { echo "::error::лаунчер не сообщил адрес за 60 с:"; cat "$log"; exit 1; }
          if [[ ! "$url" =~ ^http://127\.0\.0\.1:[0-9]+/launcher-cookie-migration$ ]]; then
            echo "::error::строка адреса нарушила контракт: $url"; cat "$log"; exit 1
          fi
          origin="${url%/launcher-cookie-migration}"
          echo "адрес лаунчера: $url"

          code=""
          for _ in $(seq 1 30); do
            code="$(curl --connect-timeout 2 --max-time 5 -sS -L -o /dev/null -w '%{http_code}' "$url" 2>>"$log" || true)"
            [ "$code" = "200" ] && break
            sleep 1
          done
          [ "$code" = "200" ] || { echo "::error::GET стартового URL вернул $code:"; cat "$log"; exit 1; }

          quit_code="$(curl --connect-timeout 2 --max-time 5 -sS -o /dev/null -w '%{http_code}' -X POST "$origin/quit" 2>>"$log" || true)"
          [ "$quit_code" = "200" ] || { echo "::error::POST /quit вернул $quit_code:"; cat "$log"; exit 1; }
          for _ in $(seq 1 30); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "::error::лаунчер не завершился по /quit"; cat "$log"; kill -9 "$pid" || true; exit 1
          fi
          rc=0
          wait "$pid" || rc=$?
          pid=""
          [ "$rc" = "0" ] || { echo "::error::код возврата $rc:"; cat "$log"; exit 1; }
          echo "smoke ok: запуск из $(dirname "$SMOKE_BIN"), ответ 200, выход 0"

  # Матрица создаёт четыре динамических check-name. Этот агрегатор даёт
  # репозиторному конфигу branch protection один стабильный контекст `smoke` и
  # краснеет, если упала либо была отменена хотя бы одна ячейка. В live-защите
  # main он станет обязательным после применения конфига владельцем.
  smoke:
    name: smoke
    needs: [smoke_matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all smoke cells
        env:
          MATRIX_RESULT: ${{ needs.smoke_matrix.result }}
        run: |
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "::error::smoke matrix завершилась со статусом $MATRIX_RESULT"
            exit 1
          fi
          echo "все smoke-ячейки зелёные"

  # Браузерные smoke-тесты критических путей (#791). До них ни одна проверка не
  # открывала приложение браузером: Go-тесты смотрят на функции и обработчики,
  # frontend-gate — только на синтаксис JS. Путь «вошёл → создал → провёл →
  # увидел движения» не проверял никто.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: '.go-version'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install test deps
        working-directory: e2e
        run: npm ci

      # Кешируем сам браузер: это ~115 МБ, качать его на каждый прогон —
      # минута впустую. Ключ включает версию playwright из lock-файла, иначе
      # после обновления пакета подтянулся бы несовместимый браузер из кеша.
      - name: Cache browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke suite
        working-directory: e2e
        env:
          CI: '1'
        run: npx playwright test

      # Без артефактов упавший браузерный тест разбирать нечем: трассировка
      # показывает шаги, снимок — что было на экране в момент падения.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 7

  # До #931 Windows-only код не исполнял ни один тестовый джоб: все тесты шли
  # на ubuntu, а Windows-цель только компилировалась. Обычные Windows-тесты
  # запускаются здесь; два файла под windows && webview — в GUI-джобе выше.
  #
  # Первый прогон этого джоба (PR #921) вскрыл шесть тестов, зависящих от
  # среды, — не от логики: короткие имена 8.3 во временном каталоге и каталог
  # установки в общем /tmp, который selfupdate законно отказывается обновлять.
  # Джоб включён обратно после их починки (#924).
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: '.go-version'
          cache: true

      # -race на Windows намеренно не включаем: дорого, а базовый прогон
      # исполняет обычные (без тега webview) windows-only тесты.
      - name: Unit tests (Windows)
        run: go test ./...

      # install.ps1 не исполнял ни один джоб: скрипт установки для Windows
      # проверялся только тем, что кто-то его запускал у себя. Опечатка в нём
      # видна пользователю в момент установки — то есть в худший момент (#888).
      #
      # Разбор парсером PowerShell, а не запуск: скрипт тянет релиз из сети и
      # ставит бинарь, исполнять его в CI незачем. Синтаксис — это всё, что
      # можно проверить дёшево и без побочных эффектов.
      - name: PowerShell syntax check (install.ps1)
        # Установщик поддерживает штатный Windows PowerShell 5.1, а pwsh на
        # runner'е — PowerShell 7. Проверяем минимальную поддержанную версию,
        # чтобы CI не пропустил, например, PS7-only операторы.
        shell: powershell
        run: |
          $errors = $null
          # install.ps1 хранится как UTF-8 без BOM и штатно приходит строкой
          # через `irm ... | iex`. Явное чтение UTF-8 воспроизводит этот путь:
          # ParseFile в Windows PowerShell 5.1 иначе считает файл ANSI.
          $source = [IO.File]::ReadAllText(
            (Resolve-Path ./install.ps1), [Text.Encoding]::UTF8)
          [System.Management.Automation.Language.Parser]::ParseInput(
            $source, [ref]$null, [ref]$errors) | Out-Null
          if ($errors -and $errors.Count -gt 0) {
            foreach ($e in $errors) {
              Write-Host "::error file=install.ps1,line=$($e.Extent.StartLineNumber)::$($e.Message)"
            }
            exit 1
          }
          Write-Host "install.ps1: синтаксис корректен"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: '.go-version'
          cache: true
      # Набор линтеров — в .golangci.yml (план 56): стартуем с того, что
      # проходит сейчас, ужесточаем по мере чистки.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: onebase
          POSTGRES_PASSWORD: onebase
          POSTGRES_DB: onebase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onebase -d onebase_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://onebase:onebase@127.0.0.1:5432/onebase_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: '.go-version'
          cache: true
      - name: Install PostgreSQL client (pg_dump/psql для DR-01 round-trip)
        # Сервис — postgres:16, поэтому и клиент 16: pg_dump старее сервера
        # отказывается снимать дамп. Пакет есть в базовых репозиториях
        # ubuntu-latest; версию печатаем для диагностики.
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          pg_dump --version
          psql --version
      - name: PostgreSQL integration tests
        run: |
          set -euo pipefail
          # Run packages sequentially: tagged suites share the service database
          # and some deliberately verify bootstrap/no-user state.
          #
          # -race здесь обязателен (план 115, этап B): конкурентные дефекты на
          # реальной СУБД юнит-джоб не видит — он гоняет SQLite. До этого
          # internal/entityservice/fifo_race_pg_test.go, существующий ради
          # гонок, исполнялся без детектора. Таймаут поднят с 5m: -race
          # замедляет прогон в несколько раз.
          go test -race -count=1 -timeout 15m -tags integration .
          go test -race -count=1 -timeout 15m -tags integration ./internal/auth
          go test -race -count=1 -timeout 15m -tags integration ./internal/storage
          go test -race -count=1 -timeout 15m -tags integration ./internal/configdb
          go test -race -count=1 -timeout 15m -tags integration ./internal/entityservice
          # internal/query до плана 115 не видел PostgreSQL вообще, хотя
          # компилятор запросов — самое диалектозависимое место платформы:
          # виртуальные таблицы разворачиваются в подзапросы, числа на SQLite
          # лежат в TEXT и требуют CAST. Матричные тесты (dbtest.ForEachDialect)
          # исполняют скомпилированный SQL на обоих диалектах.
          go test -race -count=1 -timeout 15m -tags integration ./internal/query
          # internal/dsl/interpreter — там же, где живёт семантика значений DSL.
          # Значение доезжает до модуля в разных Go-типах в зависимости от
          # диалекта (PostgreSQL отдаёт булево как bool, SQLite как int64), и
          # ветка «истина/ложь» из-за этого расходилась молча (issue #704).
          # Без этой строки postgres-подтесты матричных тестов пакета
          # пропускались: TEST_DATABASE_URL задан только в этом джобе.
          go test -race -count=1 -timeout 15m -tags integration ./internal/dsl/interpreter
          # Матрица doctor намеренно не имеет build tag: обычный unit-job
          # исполняет SQLite-половину, а PostgreSQL-половина без этой строки
          # молча Skip-ается, потому что TEST_DATABASE_URL есть только здесь.
          # Гоним весь пакет, чтобы новый матричный тест нельзя было добавить
          # рядом с checks_matrix_test.go и случайно оставить вне PG-гейта.
          go test -race -count=1 -timeout 15m ./internal/dbcheck
          # Очередь фоновых заданий (план 130). Юнит-джоб гоняет её на SQLite,
          # где исполнитель ровно один по построению — то есть ГЛАВНОЕ свойство
          # подсистемы, параллельная работа N исполнителей и расхождение
          # конкурентов через FOR UPDATE SKIP LOCKED, там не проверяется вообще.
          # Без этой строки пул на 16–32 исполнителя не доказан ни одним гейтом.
          go test -race -count=1 -timeout 15m ./internal/jobqueue
          # Table-part shape compatibility is dialect-matrix tested in
          # internal/exchange. The regular unit job has no TEST_DATABASE_URL,
          # so explicitly gate the PostgreSQL half here.
          go test -race -count=1 -timeout 5m ./internal/exchange \
            -run '^TestApplyPackage_НедостающееПолеТЧПринимается$/^postgres$'
          # DR-01 (issue #784): сквозной backup→restore PostgreSQL. Проверяет,
          # что pg_dump снимает дамп, а psql-restore возвращает те же данные
          # (round-trip на выделенной базе, чтобы разрушительный restore не
          # затронул общую onebase_test). Требует pg_dump/psql — см. шаг выше.
          go test -race -count=1 -timeout 10m -tags integration ./internal/backup \
            -run '^(TestPostgresBackupRestoreRoundTrip|TestUniversalBackupRoundTripInNonPublicSchema)$'
          # Owner-aware image demo has a PostgreSQL-only inter-server race
          # regression. Select the exact matrix subtest so this job does not
          # expand into the full internal/ui suite.
          go test -race -count=1 -timeout 5m ./internal/ui \
            -run '^TestTradeImageDemo_ConcurrentRunsCreateSingleBlob$/^postgres$'
          # Information-register record-set security is matrix-tested in the
          # UI package. Run the PostgreSQL side explicitly: the regular unit
          # job has no TEST_DATABASE_URL and therefore only exercises SQLite.
          go test -race -count=1 -timeout 5m ./internal/ui \
            -run '^(TestInfoRegDSL_(WriteReadDeleteMatrix|UpsertByKeyMatrix)|TestInfoRegSet_(ReplacesOnlyFilteredMatrix|ЦиклЧтениеЗаписьНаПериодическомMatrix|АтомаренВоВнешнейТранзакции|РегистрируетTombstoneУдалённыхСтрок|ТипизированныйОтборМатрица))$/^postgres$'
          go test -race -count=1 -timeout 10m ./internal/ui \
            -run '^(TestInfoRegRecordSet_ReadAppliesObjectAndRowAccessMatrix|TestInfoRegRecordSet_WritePreflightsObjectPermissionsMatrix|TestInfoRegRecordSet_RowPolicyIsNoExistenceOracleMatrix|TestInfoRegRecordSet_ProposedNullUsesSQLThreeValuedPolicyMatrix|TestInfoRegRecordSet_ProposedTypedValuesUseSQLPolicyMatrix|TestInfoRegRecordSet_DeletePeriodRLSUsesTypedPeriodMatrix|TestInfoRegRecordSet_PostgresConcurrentInsertCheckedByRLS)$/^postgres$'
          # HTTP information-register deletes have their own exact-key/RLS
          # matrix. The PostgreSQL branch includes deterministic row-lock races;
          # the ordinary unit job only executes its SQLite side.
          go test -race -count=1 -timeout 10m ./internal/ui \
            -run '^(TestUIInfoRegDeleteTypedCompositeKeyMatrix|TestUIInfoRegDeleteRowPolicyNoOracleAndOutboxMatrix|TestUIInfoRegDeletePeriodMaskMatrix|TestUIInfoRegDeleteStorageErrorMatrix|TestUIInfoRegDeletePostgresConcurrentRacesMatrix)$/^postgres$'

  vuln:
    # Сканирование известных уязвимостей в зависимостях и stdlib. govulncheck
    # анализирует только достижимый код (call graph), поэтому шумит меньше, чем
    # аудит всего go.sum: падает лишь когда уязвимая функция реально вызывается.
    # Важно для платформы с сетевым egress (HTTP-клиент, email, LLM,
    # ВыполнитьКоманду) — ловит уязвимые транзитивные зависимости и версию Go до
    # релиза. На момент добавления достижимых advisory нет: модульные закрыты
    # бампом (x/net, pgx/v5), stdlib — патчами в go-version toolchain'а ниже.
    # Держите go-version актуальным и пиньте патч-версию: floating 1.26.x может
    # взять устаревший toolcache на GitHub runner и завалить govulncheck.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: '.go-version'
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  bench:
    # Контроль регрессий производительности: гоняем микробенчмарки горячих путей
    # (DSL-интерпретатор, storage CRUD, проведение документа) на PR и сравниваем
    # с базой через benchstat. Все бенчи работают на SQLite в tempdir — внешних
    # сервисов не нужно. Только для pull_request (нужна база для сравнения).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: '.go-version'
          cache: true

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260709024250-82a0b07e230d

      - name: Benchmark (PR)
        run: |
          go test -run NONE -bench . -benchmem -count 6 \
            ./internal/dsl/interpreter/ ./internal/storage/ ./internal/entityservice/ ./internal/query/ \
            | tee bench-pr.txt

      - name: Benchmark (base)
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}
          # На базе бенч-функций может не быть — тогда файл пустой, benchstat
          # просто покажет только числа PR. Не валим джоб из-за этого.
          go test -run NONE -bench . -benchmem -count 6 \
            ./internal/dsl/interpreter/ ./internal/storage/ ./internal/entityservice/ ./internal/query/ \
            | tee bench-base.txt || true
          git checkout -

      - name: Compare (benchstat)
        run: benchstat bench-base.txt bench-pr.txt | tee benchstat.txt

      - name: Upload benchstat report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchstat
          path: benchstat.txt

      # Порог просадки (план 115, этап D). До этого джоб только печатал отчёт:
      # порога не было, базовый прогон завершался `|| true` — то есть джоб
      # создавал впечатление защиты от регрессий, которой не было. Просадка
      # вроде #623 (полный скан при удалении из полнотекстового индекса)
      # проходила беспрепятственно.
      #
      # Гейт смотрит только СТАТИСТИЧЕСКИ ЗНАЧИМЫЕ изменения: незначимые
      # benchstat помечает «~», и они игнорируются, иначе шум разделяемого
      # раннера ронял бы каждый второй PR. Порог 25% выбран мягким намеренно —
      # ловим обвалы, а не колебания. Сам разбор покрыт тестами
      # (tools/benchgate/main_test.go), чтобы гейт не оказался декорацией.
      #
      # Одной значимости мало: при разбросе замеров в сотни процентов значимость
      # достигается легко, а величина «vs base» не значит ничего — PR из двух
      # правок markdown получал «+79.86%» при разбросе ±152% (issue #683).
      # Поэтому строки, где разброс не меньше самой просадки, отбрасываются —
      # с печатью в лог, чтобы это не превратилось в тихое замалчивание.
      - name: Fail on performance regression
        run: |
          benchstat -format csv bench-base.txt bench-pr.txt 2>/dev/null \
            | go run ./tools/benchgate -threshold 25

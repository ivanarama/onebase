name: Temporary lint installation proof

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  cold-warm-cgo1-public-action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: go1.26.10
      CGO_ENABLED: "1"
      GOMODCACHE: ${{ runner.temp }}/lint-proof-modcache
      GOCACHE: ${{ runner.temp }}/lint-proof-buildcache
      GOBIN: ${{ runner.temp }}/lint-proof-cgo1-tools
      GOLANGCI_LINT_CACHE: ${{ runner.temp }}/lint-proof-analysis-cache
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: false
      - name: Prove cold private caches and CGO toolchain
        run: |
          set -euo pipefail
          test "$(go version | awk '{print $3}')" = go1.26.10
          test "$(go env CGO_ENABLED)" = 1
          command -v gcc
          for directory in "$GOMODCACHE" "$GOCACHE" "$GOBIN" "$GOLANGCI_LINT_CACHE"; do
            test ! -e "$directory"
            mkdir "$directory"
            test -z "$(find "$directory" -mindepth 1 -print -quit)"
          done
          mkdir "$RUNNER_TEMP/lint-install-proof"
          go version > "$RUNNER_TEMP/lint-install-proof/toolchain.txt"
          gcc --version >> "$RUNNER_TEMP/lint-install-proof/toolchain.txt"
      - name: Cold CGO1 install and full normal lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
          install-mode: goinstall
          skip-cache: true
      - name: Record cold binary provenance
        run: |
          set -euo pipefail
          test "$(command -v golangci-lint)" = "$GOBIN/golangci-lint"
          golangci-lint --version | tee "$RUNNER_TEMP/lint-install-proof/cold-version.txt"
          go version -m "$GOBIN/golangci-lint" | tee "$RUNNER_TEMP/lint-install-proof/cold-buildinfo.txt"
          grep -F 'github.com/golangci/golangci-lint/v2' "$RUNNER_TEMP/lint-install-proof/cold-buildinfo.txt" | grep -F 'v2.11.4'
          grep -F 'CGO_ENABLED=1' "$RUNNER_TEMP/lint-install-proof/cold-buildinfo.txt"
          sha256sum "$GOBIN/golangci-lint" > "$RUNNER_TEMP/lint-install-proof/cold-binary.sha256"
      - name: Warm CGO1 install and full normal lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
          install-mode: goinstall
          skip-cache: true
      - name: Record warm binary provenance
        run: |
          set -euo pipefail
          go version -m "$GOBIN/golangci-lint" > "$RUNNER_TEMP/lint-install-proof/warm-buildinfo.txt"
          grep -F 'CGO_ENABLED=1' "$RUNNER_TEMP/lint-install-proof/warm-buildinfo.txt"
          sha256sum "$GOBIN/golangci-lint" > "$RUNNER_TEMP/lint-install-proof/warm-binary.sha256"
      - name: Real lint runner driver regression
        env:
          GOTOOLCHAIN: go1.26.10
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/lint-runner-tools" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
          bootstrap_root="$(cd "$RUNNER_TEMP" && GOTOOLCHAIN=go1.26.3 go env GOROOT)"
          LINT_RUNNER_TEST_BOOTSTRAP_GO="$bootstrap_root/bin/go" LINT_RUNNER_TEST_LINTER="$RUNNER_TEMP/lint-runner-tools/golangci-lint" python3 .github/scripts/lint_runner_driver_test.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Checkout official public action entrypoint for negative probes
        uses: actions/checkout@v4
        with:
          repository: golangci/golangci-lint-action
          ref: v8
          path: .ci-lint-proof-upstream
          persist-credentials: false
      - name: Public compiled action rejects bad lint and invalid config
        run: python3 .github/scripts/lint_install_proof.py .ci-lint-proof-upstream
      - name: Preserve proof even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-install-cold-warm-cgo1-public-action
          path: ${{ runner.temp }}/lint-install-proof
          if-no-files-found: error
          retention-days: 14

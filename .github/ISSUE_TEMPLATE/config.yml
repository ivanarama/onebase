blank_issues_enabled: true
contact_links:
  - name: Сообщить об ошибке без аккаунта GitHub
    url: https://github.com/ivanarama/onebase/blob/main/docs/features.md
    about: >
      В самой программе есть кнопка «Сообщить об ошибке» — она соберёт отчёт
      одним файлом (меню «Система», панель лаунчера или `onebase support`).
      Файл можно отправить внедренцу или разработчику любым каналом.

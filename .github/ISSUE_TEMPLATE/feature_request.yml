name: Идея или улучшение
description: Предложить пользовательскую возможность без обязательства её реализовывать
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за идею. Можно написать коротко: кто и что хочет сделать.
        Если вы собираетесь сами проверить гипотезу, issue не обязательна —
        откройте Draft PR по правилам CONTRIBUTING.md.

  - type: textarea
    id: outcome
    attributes:
      label: Что хотелось бы получить
      description: Пользовательский сценарий, пример или скриншот — в любом удобном виде.
      placeholder: Оператор выбирает филиал и видит только направления этого филиала.

  - type: textarea
    id: context
    attributes:
      label: Контекст
      description: Почему это важно, какой обход используете сейчас — если известно.

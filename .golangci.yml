# Конфиг golangci-lint (план 56, этап 2).
#
# Стратегия — прогрессивное ужесточение: включено то, что проходит на текущем
# коде (CI остаётся зелёным), остальное включается по мере чистки baseline.
# Staticcheck включён после закрытия baseline в 2026-07.
# bodyclose включён по плану 109 (этап A): baseline был 0 находок.
# unused включён по плану 109 (этап B): 29 находок мёртвого кода удалены.
# errcheck включён по плану 109 (этапы D–G): 968 находок разобраны по классам
# поведения, baseline закрыт до нуля.
# Оставшаяся очередь (план 109): gosec.
# После чистки соответствующего линтера — переносить его в enable.
version: "2"

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck
    - bodyclose
    - unused
    - errcheck

  # gosec на тестах (план 109, этап H).
  #
  # 388 из 1029 находок gosec приходились на _test.go, и по разбору это
  # фикстуры, а не код, который куда-то поставляется:
  #
  #   G306/G301 (307) — права на каталогах из t.TempDir();
  #   G304  (58) — чтение файла, который тест сам же и создал;
  #   G101  (10) — фейковые DSN и ключи в фикстурах;
  #   G404   (4) — math/rand для тестовых данных;
  #   G602   (3) — индексация среза в проверках.
  #
  # Отключаем в тестах ТОЛЬКО эти правила, а не gosec целиком: G204 (запуск
  # подпроцессов), G110 (архивные бомбы) и taint-правила в тестовом хелпере
  # заметить как раз стоило бы, и они остаются активными.
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
        text: "(G306|G301|G304|G101|G404|G602)"

run:
  timeout: 10m


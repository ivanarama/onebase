# Конфиг golangci-lint (план 56, этап 2).
#
# Стратегия — прогрессивное ужесточение: включено то, что проходит на текущем
# коде (CI остаётся зелёным), остальное включается по мере чистки baseline.
# Staticcheck включён после закрытия baseline в 2026-07.
# bodyclose включён по плану 109 (этап A): baseline был 0 находок.
# unused включён по плану 109 (этап B): 29 находок мёртвого кода удалены.
# errcheck включён по плану 109 (этапы D–G): 968 находок разобраны по классам
# поведения, baseline закрыт до нуля.
# Оставшаяся очередь (план 109): gosec.
# После чистки соответствующего линтера — переносить его в enable.
version: "2"

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck
    - bodyclose
    - unused
    - errcheck

run:
  timeout: 10m

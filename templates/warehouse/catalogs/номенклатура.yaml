name: Номенклатура
fields:
  - name: Наименование
    type: string
  - name: Артикул
    type: string
  - name: ЕдиницаИзмерения
    type: string
  - name: СтавкаНДС
    type: enum:СтавкаНДС
    label: Ставка НДС (для фискального чека, тег ФФД 1199)
  - name: ПризнакПредмета
    type: enum:ПризнакПредмета
    label: Признак предмета расчёта (тег ФФД 1212)

# Уникальность и индексы по произвольным реквизитам. Уникальный индекс —
# единственная настоящая защита от дубля: проверка «нет ли уже такого» в
# ПриЗаписи не спасает, когда двое пишут одновременно. Незаполненный реквизит
# пишется NULL и уникальности не мешает — позиций без артикула может быть
# сколько угодно.
indexes:
  - fields: [Артикул]
    unique: true

name: Сайт
title: Приём заявок с сайта (входной шлюз, план 90)
root_url: site
# auth hmac: отправитель (сайт/партнёр/мост RabbitMQ→HTTP) подписывает тело —
# X-Webhook-Signature = hex(HMAC-SHA256(тело, secret)). Секрет — из окружения, не в
# git. /hs-эндпоинт ещё гейтится предохранителем сети (план 62): включите
# «Разрешить сетевые операции конфигурации» в конфигураторе (Меню → «Параметры
# базы»). Проверка без сети/подписи — обработкой «ТестПриёмка».
auth: hmac
secret: "${env:SITE_SECRET}"
rate_limit: 600
templates:
  - template: /lead
    methods:
      POST: Лид

name: ОбработанныеСобытия
title: Обработанные события (идемпотентность)
# Стор ключей идемпотентности (план 90, ЗАХОД 0 — прикладной паттерн пробела G6).
# Одна запись = одно уникально принятое входящее событие. Обработчик приёмки ищет
# запись по «Ключ» (event_id конверта): нашёл с тем же телом → дубль (вернуть прежний
# результат, не создавать заявку заново); нашёл с другим телом → несовпадение схемы;
# не нашёл → создать бизнес-объект и записать сюда.
#
# ЧЕСТНОЕ ОГРАНИЧЕНИЕ захода 0 (мотивирует заход 1 в движке): «найти + создать» не
# атомарны (гонка TOCTOU — два параллельных дубля оба не найдут ключ и оба заведут
# заявку), а уникальность ключа не гарантируется на уровне хранилища. Это закрывается
# только заходом 1: storage-примитив internal/intake с UNIQUE(intake,scope,key) +
# INSERT … ON CONFLICT DO NOTHING и транзакционной связкой «обработчик + отметка».
hierarchical: false
fields:
  - name: Наименование
    type: string
    label: Ключ идемпотентности (подпись для списка)
  - name: Ключ
    type: string
    label: event_id конверта — ключ идемпотентности
  - name: Источник
    type: string
    label: source конверта (пространство ключа)
  - name: ТелоКанон
    type: string
    label: Канонизированный payload — сверка дублей и несовпадений
  - name: СсылкаРезультат
    type: string
    label: Ссылка на созданный бизнес-объект (Заявка)
  - name: Корреляция
    type: string
    label: correlation_id — сквозная трассировка
  - name: Момент
    type: date
    label: Когда принято

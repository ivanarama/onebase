name: КарантинСобытий
title: Карантин событий (DLQ)
# «Битое» входящее событие (ошибка обработчика, несовпадение схемы, конфликт ключа)
# не теряется и не ретраится бесконечно, а откладывается сюда с сырым телом и причиной
# (план 90, заход 0, пробел G6). Оператор чинит причину и запускает обработку
# «Повторить из карантина» (replay через ту же приёмку — идемпотентность соблюдается).
# Непроводимый документ: это журнал разбора, а не источник движений.
numerator:
  prefix: "КАР-"
  length: 6
  period: year
fields:
  - name: Номер
    type: string
  - name: Дата
    type: date
  - name: Ключ
    type: string
    label: event_id конверта
  - name: Источник
    type: string
    label: source конверта
  - name: ТипОбъекта
    type: string
    label: aggregate конверта (тип бизнес-объекта)
  - name: ТелоСырое
    type: string
    label: Сырой конверт (JSON) — для повтора после починки
  - name: Причина
    type: enum:ПричинаКарантина
  - name: Ошибка
    type: string
    label: Текст ошибки обработчика/валидации
  - name: Попытки
    type: number
    label: Сколько раз пытались обработать
  - name: Состояние
    type: enum:СостояниеКарантина
    label: Открыт → Повторён (после успешного replay)
  - name: Корреляция
    type: string
    label: correlation_id

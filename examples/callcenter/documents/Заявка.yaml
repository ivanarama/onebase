name: Заявка
title: Заявка
# Демонстрационный объект плана 89: заявка проверяется управляемыми правилами
# при записи (хук ПриЗаписи в src/Заявка.os). Непроводимый документ — каждая
# запись идёт через OnWrite, где применяются действующие правила валидации.
numerator:
  prefix: "ЗАЯ-"
  length: 6
  period: year
fields:
  - name: Номер
    type: string
  - name: Дата
    type: date
  - name: Состояние
    type: enum:СостояниеЗаявки
    label: Состояние согласования (пусто/Черновик → НаСогласовании → Утверждена/Отклонена)
  - name: Клиент
    type: reference:Клиент
  - name: Улица
    type: string
  - name: Телефон
    type: string
  - name: Комментарий
    type: string
# Этапы (план 121): маршрут согласования объявлен платформе, а не только описан
# в модуле. Гейт переходов стоит в слое хранения — его не обойти ни формой, ни
# обработкой, ни REST, — а история переходов пишется сама и даёт отчёт
# «где застряло» (/ui/stages).
#
# enforce: strict — в примере маршрут соблюдается по-настоящему: база демо
# создаётся с нуля, накопленных состояний «мимо маршрута» в ней нет, и смысл
# показывать нечего не соблюдаемое правило. В РАБОЧЕЙ базе начинайте с
# умолчания `warn`: strict отверг бы первую же правку объекта, состояние
# которого маршруту не соответствует. Посмотрите строку «Вне маршрута» в отчёте
# /ui/stages, разберите такие объекты — и только потом включайте strict.
stages:
  field: Состояние
  order: [Черновик, НаСогласовании, Утверждена, Отклонена]
  transitions:
    - { from: Черновик,       to: [НаСогласовании] }
    - { from: НаСогласовании, to: [Утверждена, Отклонена] }
    - { from: Отклонена,      to: [Черновик] }
  deadline_days: { НаСогласовании: 2 }
  enforce: strict

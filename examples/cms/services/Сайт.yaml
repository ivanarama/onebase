name: Сайт
title: Публичный сайт
root_url: site
# Публичная поверхность: аноним читает страницы, ничего не изменяя. Записи с
# сайта (заявки) появятся отдельным сервисом со своей защитой — смешивать
# чтение и приём данных в одном анонимном сервисе не нужно.
auth: none
rate_limit: 600
# Сжатие включено умолчанием для auth: none, здесь оно указано явно как
# документация намерения.
compress: true
# Кэш ответов (план 126). Ключ учитывает адрес и домен: на одной базе может
# жить несколько сайтов. Инвалидация — обязанность конфигурации: модуль
# общие.module.os сбрасывает кэш при записи контента.
cache:
  ttl: 60
  vary: [query, host]
  public: true
# Заголовки публичной страницы строже глобальных: она открывается посторонним
# посетителем, поэтому источники скриптов ограничены своим доменом, а вставка
# сайта во фрейм запрещена.
security_headers:
  csp: "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'"
  frame_options: DENY
  referrer_policy: strict-origin-when-cross-origin
templates:
  - template: /robots.txt
    methods:
      GET: Роботс
  - template: /{*путь}
    methods:
      GET: Роутер

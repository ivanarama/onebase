name: Магазин
title: Корзина и заказы с сайта
root_url: shop
# Третий публичный сервис примера, и это не дробление ради красоты. У «Сайта»
# анонимное чтение С КЭШЕМ, у «Форм» — анонимная запись, здесь — анонимное
# чтение, но ПЕРСОНАЛЬНОЕ: страница корзины у каждого посетителя своя.
#
# Кэша здесь нет и быть не может: `vary` умеет только query, host и lang
# (internal/httpservice/service.go:90), про куку он не знает. Положи корзину в
# кэшируемый сервис — и первый посетитель раздаст свою корзину всем следующим.
auth: none
# Мягче, чем у «Форм» (60): корзина набирается кликами, и десяток нажатий
# «плюс» подряд — обычное поведение живого покупателя, а не перебор.
rate_limit: 120
compress: true
security_headers:
  # Та же политика, что у «Сайта»: страницы магазина отдаются в общем макете и
  # тянут /hs/site/style.css. При default-src 'none' браузер заблокировал бы
  # таблицу стилей, и корзина открывалась бы нестилизованным HTML.
  csp: "default-src 'self'; img-src 'self' data:; style-src 'self'"
  frame_options: DENY
  referrer_policy: strict-origin-when-cross-origin
templates:
  # Адреса латиницей — по той же причине, что у «Форм»: кириллический сегмент
  # шаблона сопоставляется только с процентным кодированием.
  - template: /cart
    methods:
      GET: ПоказатьКорзину
  - template: /cart/add
    methods:
      POST: ДобавитьВКорзину
  - template: /cart/update
    methods:
      POST: ИзменитьКорзину
  - template: /checkout
    methods:
      GET: ФормаЗаказа
      POST: Оформить
  - template: /order/{ид}
    methods:
      GET: ПоказатьЗаказ

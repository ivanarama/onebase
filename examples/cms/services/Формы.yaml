name: Формы
title: Приём заявок с сайта
root_url: forms
# Отдельный сервис от «Сайта» осознанно: там анонимное чтение с кэшем, здесь
# анонимная ЗАПИСЬ. Смешивать их в одном сервисе значит распространить настройки
# одного на другой — например, закэшировать ответ на отправку формы.
auth: none
# Жёстче, чем у страниц: приём заявок — цель для перебора и спама.
rate_limit: 60
compress: true
security_headers:
  # Та же политика, что у «Сайта», а не `default-src 'none'`: сервис отвечает
  # не JSON'ом, а полноценной страницей сайта в общем макете — со ссылкой на
  # /hs/site/style.css. При `none` браузер эту таблицу стилей блокирует
  # (style-src наследует default-src), и посетитель после КАЖДОЙ отправки
  # формы видит нестилизованный HTML.
  csp: "default-src 'self'; img-src 'self' data:; style-src 'self'"
  frame_options: DENY
templates:
  # Адрес латиницей намеренно: кириллический сегмент шаблона сопоставляется
  # только с процентным кодированием, а браузеры и клиенты шлют путь по-разному.
  # Публичные адреса и так принято писать латиницей.
  - template: /submit/{код}
    methods:
      POST: Отправить

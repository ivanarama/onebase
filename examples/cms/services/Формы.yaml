name: Формы
title: Приём заявок с сайта
root_url: forms
# Отдельный сервис от «Сайта» осознанно: там анонимное чтение с кэшем, здесь
# анонимная ЗАПИСЬ. Смешивать их в одном сервисе значит распространить настройки
# одного на другой — например, закэшировать ответ на отправку формы.
auth: none
# Жёстче, чем у страниц: приём заявок — цель для перебора и спама.
rate_limit: 60
compress: true
security_headers:
  csp: "default-src 'none'"
  frame_options: DENY
templates:
  # Адрес латиницей намеренно: кириллический сегмент шаблона сопоставляется
  # только с процентным кодированием, а браузеры и клиенты шлют путь по-разному.
  # Публичные адреса и так принято писать латиницей.
  - template: /submit/{код}
    methods:
      POST: Отправить

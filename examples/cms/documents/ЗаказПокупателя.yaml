name: ЗаказПокупателя
title: Заказ с сайта
# Проведения нет: остатки витрина не ведёт, резервировать нечего. Складскую
# часть добавляет конфигурация внедрения — ей хватит ОбработкаПроведения, а
# примеру склад не нужен, чтобы показать путь «корзина → документ».
posting: false
notify_changes: true
list_refresh_on: [данные.заказпокупателя]
list_filters: [Номер, Дата, Статус, Покупатель, Ответственный]
numerator:
  prefix: "ЗС-"
  length: 6
  period: year
stages:
  field: Статус
  order: [Новый, ВРаботе, Выполнен, Отменён]
  transitions:
    - {from: Новый, to: [ВРаботе, Отменён]}
    - {from: ВРаботе, to: [Выполнен, Отменён]}
  enforce: strict
fields:
  - name: Номер
    type: string
  - name: Дата
    type: date
  - name: Сайт
    type: reference:Сайты
  - name: Наименование
    title: Имя покупателя
    type: string
  - name: Контакт
    title: Почта или телефон
    type: string
  - name: Комментарий
    type: string
  - name: Сумма
    type: number
  # Денежная единица фиксируется вместе с суммой. Читать её позже из товара
  # нельзя: каталог изменяем, а заказ — исторический документ.
  - name: Валюта
    type: string
  - name: Статус
    type: enum:СтатусЗаказа
  # Ссылку покупателю выдаём на UUID документа, а не на его номер: номер
  # предсказуем, и перебор отдал бы чужие телефоны и адреса. Отдельного токена
  # для этого не заводим — UUID записи платформа выдаёт случайный.
  - name: ОшибкаОтправкиПисьма
    title: Письмо не ушло (причина)
    type: string
  - name: Покупатель
    type: reference:Покупатели
  - name: Телефон
    type: string
  - name: СпособПолучения
    type: enum:СпособПолучения
  - name: АдресДоставки
    type: reference:АдресаДоставки
  - name: Город
    type: reference:Города
  - name: ПунктВыдачи
    type: reference:ПунктыВыдачи
  - name: Ответственный
    type: reference:_users
tableparts:
  - name: Товары
    fields:
      - name: Товар
        type: reference:Товары
      # Наименование, артикул и цена копируются в строку заказа намеренно.
      # Товар потом переименуют, подорожает или уедет из публикации, а заказ
      # обязан остаться читаемым в том виде, в каком его оформил покупатель.
      - name: Наименование
        type: string
      - name: Артикул
        type: string
      - name: Количество
        type: number
      - name: Цена
        type: number
      - name: Сумма
        type: number

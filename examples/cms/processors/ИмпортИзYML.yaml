name: ИмпортИзYML
title: Импорт каталога из YML-выгрузки
params:
  - name: Сайт
    type: reference:Сайты
    label: Сайт-владелец каталога
    required: true
  # Обязателен явно: после запуска браузер не возвращает выбранный файл в поле,
  # и повторное «Выполнить» уходило на сервер пустым. Человек получал ошибку
  # прикладного модуля про ключ командной строки, стоя перед формой.
  - name: Файл
    type: file
    label: Файл выгрузки (YML)
    required: true
  # Адреса картинок приходят ИЗ ЗАГРУЖЕННОГО ФАЙЛА, то есть от того, кто прислал
  # выгрузку. Скачивать по ним что попало нельзя: сервер сходит куда угодно
  # внутри периметра — на 169.254.169.254 за облачными ключами, на соседний порт
  # с базой. Поэтому источник называет ОПЕРАТОР, а не файл: качаем только с этого
  # домена, остальные адреса пропускаем и считаем. Пусто = картинки не качать.
  - name: ИсточникКартинок
    type: string
    label: Домен, с которого качать картинки (пусто — не качать)

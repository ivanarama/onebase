# Значения экранируются автоматически, готовая разметка приходит через
# БезопасныйHTML — поэтому в макете НЕ должно быть ручной склейки строк.
fields:
  - name: Наименование
    type: string
  - name: Версия
    type: string
  - name: МакетHTML
    title: HTML-макет
    type: string
  - name: Описание
    type: string

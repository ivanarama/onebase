name: МаршрутыURL
title: Маршруты URL
# Задел под правила ЧПУ в духе SEF-правил Битрикса (/catalog/<группа>/<товар>):
# шаблон адреса → тип контента, чтобы менять структуру адресов без правки
# модулей.
#
# ВНИМАНИЕ: роутер этот справочник пока НЕ читает — он подбирает страницу и
# новость по слагу (см. Роутер.module.os). Справочник заведён заранее, чтобы
# при появлении правил не мигрировать данные; до тех пор записи здесь ни на
# что не влияют. Раньше комментарий утверждал обратное («роутер работает по
# правилам, а не ищет слаг») — читатель искал в модуле разбор шаблонов,
# которого там нет.
search_fields: [Наименование, Шаблон]
fields:
  - name: Наименование
    type: string
  - name: Шаблон
    title: Шаблон адреса
    type: string
  - name: ТипКонтента
    title: Тип контента
    type: string
  - name: Приоритет
    type: number
  - name: Активен
    type: bool
  - name: Сайт
    type: reference:Сайты

# Без блока activity созданная в интерфейсе запись приходила с пустым флагом,
# то есть неактивной, и молча не показывалась на сайте (#1014).
activity:
  field: Активен
  default_scope: active
  hide_from_choice: true

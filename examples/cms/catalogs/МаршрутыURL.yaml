name: МаршрутыURL
title: Маршруты URL
# Роутер работает по правилам, а не «ищет слаг»: шаблон адреса → тип контента.
# Это даёт ЧПУ в духе SEF-правил Битрикса (/catalog/<группа>/<товар>) и
# позволяет менять структуру адресов без правки модулей.
search_fields: [Наименование, Шаблон]
fields:
  - name: Наименование
    type: string
  - name: Шаблон
    title: Шаблон адреса
    type: string
  - name: ТипКонтента
    title: Тип контента
    type: string
  - name: Приоритет
    type: number
  - name: Активен
    type: bool
  - name: Сайт
    type: reference:Сайты

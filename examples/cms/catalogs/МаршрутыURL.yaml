name: МаршрутыURL
title: Маршруты URL
# Правила ЧПУ в духе SEF-правил Битрикса: шаблон адреса → тип контента.
# Структура адресов меняется записью в справочнике, а не правкой модулей
# (план 129, решение 5).
#
# Шаблон — сегменты через «/», где «{слаг}» — подстановка:
#   «/»              корень сайта
#   «news»           список новостей
#   «news/{слаг}»    карточка новости
#   «catalog/{слаг}» раздел каталога
#   «{слаг}»         страница по слагу
#
# ТипКонтента: Страница | Новости | Каталог | Товар.
#
# Шаблон без подстановки проверяется раньше шаблона с ней, поэтому «news»
# выигрывает у «{слаг}» независимо от приоритета. Приоритет решает споры
# внутри этих двух групп.
#
# Пустой справочник НЕ ломает сайт: тогда действуют правила по умолчанию из
# Роутер.МаршрутыПоУмолчанию — те же, что перечислены выше. Правила
# справочника проверяются первыми, умолчания остаются запасными: иначе одна
# заведённая строка выключила бы все остальные адреса сайта разом. Чтобы
# перекрыть умолчание, заведите правило с тем же шаблоном.
search_fields: [Наименование, Шаблон]
fields:
  - name: Наименование
    type: string
  - name: Шаблон
    title: Шаблон адреса
    type: string
  - name: ТипКонтента
    title: Тип контента
    type: string
  - name: Приоритет
    type: number
  - name: Активен
    type: bool
  - name: Сайт
    type: reference:Сайты

# Без блока activity созданная в интерфейсе запись приходила с пустым флагом,
# то есть неактивной, и молча не показывалась на сайте (#1014).
activity:
  field: Активен
  default_scope: active
  hide_from_choice: true

name: Медиа
title: Медиатека
# Файлы сайта живут в базе, а не на внешнем CDN. Наружу отдаются публичной
# ссылкой /pub/<токен> (план 127): её выдаёт ОпубликоватьФайл и запоминает
# реквизит ПубличнаяСсылка, чтобы не публиковать заново на каждый рендер.
search_fields: [Наименование, Альт]
fields:
  - name: Наименование
    type: string
  - name: Файл
    title: Изображение
    type: image
  - name: Тип
    type: enum:ТипМедиа
  - name: Альт
    title: Альтернативный текст
    type: string
  - name: ПубличнаяСсылка
    title: Публичная ссылка
    type: string
  # Владелец и ключ источника нужны импорту каталога: элемент нельзя искать по
  # наименованию. Названия товаров повторяются (в том числе у РАЗНЫХ сайтов), и
  # поиск по имени отдавал второму товару картинку первого, а второй адрес даже
  # не запрашивался. Ключ — адрес картинки в источнике, область — сайт.
  - name: Сайт
    type: reference:Сайты
  - name: ВнешнийКлюч
    title: Адрес в источнике (ключ импорта)
    type: string
  - name: Активен
    type: bool

# Без блока activity созданная в интерфейсе запись приходила с пустым флагом,
# то есть неактивной, и молча не показывалась на сайте (#1014).
activity:
  field: Активен
  default_scope: active
  hide_from_choice: true

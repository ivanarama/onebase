name: Редиректы
title: Редиректы
# Переезд с прежней CMS не должен обнулять позиции в поиске: старый адрес
# отвечает 301 на новый. Заполняется при миграции с Битрикса и при смене
# структуры разделов.
search_fields: [Откуда, Куда]
fields:
  - name: Откуда
    title: Старый адрес
    type: string
  - name: Куда
    title: Новый адрес
    type: string
  - name: Код
    title: HTTP-код (301 или 302)
    type: number
  - name: Активен
    type: bool
  - name: Сайт
    type: reference:Сайты

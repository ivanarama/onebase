name: Сайты
title: Сайты
# Сайт = домен + стиль + шаблон + корневая страница. Роутер выбирает сайт по
# заголовку Host (при промахе — первый активный).
#
# До правки движка выбор по домену не работал вовсе: Go вынимает Host из карты
# заголовков в отдельное поле запроса, и «Запрос.Заголовки.Получить("Host")»
# возвращал пустоту — маршрут всегда доставался первому активному сайту.
#
# ВАЖНО, что по Host выбирается ОФОРМЛЕНИЕ, а не контент: страницы, новости,
# меню и редиректы у всех сайтов базы общие — ни одна выборка не фильтрует по
# полю «Сайт». Так решено планом 129 (п. 10): поле у контентных сущностей
# заведено сразу, чтобы не мигрировать данные при появлении второго сайта, а
# фильтр добавляется тогда, когда второй сайт реально понадобится. До этого
# момента считайте конфигурацию одно-сайтовой: второй домен покажет тот же
# контент в своём оформлении.
search_fields: [Наименование, Домен]
fields:
  - name: Наименование
    type: string
  - name: Домен
    type: string
  - name: Стиль
    type: reference:СтилиСайта
  - name: Шаблон
    type: reference:ШаблоныСайта
  - name: Язык
    type: string
  - name: РоботсTxt
    title: Содержимое robots.txt
    type: string
  # Префикс, под которым сайт виден СНАРУЖИ. Пусто = сайт отдаётся в корне
  # домена (рекомендованная схема с reverse proxy «/ → /hs/site/»), иначе —
  # префикс вида «/hs/site» для прямого доступа к платформе.
  #
  # Раньше canonical и sitemap.xml жёстко писали «/hs/site/», и за прокси
  # получались адреса, которых снаружи нет: прокси добавлял свой префикс ещё
  # раз. Для поисковика это адреса на 404 — ровно там, где цена ошибки
  # максимальна (#1014).
  - name: ПрефиксПути
    title: Базовый префикс адреса сайта
    type: string
  - name: Активен
    type: bool

# Без блока activity созданная в интерфейсе запись приходила с пустым флагом,
# то есть неактивной, и молча не показывалась на сайте (#1014).
activity:
  field: Активен
  default_scope: active
  hide_from_choice: true

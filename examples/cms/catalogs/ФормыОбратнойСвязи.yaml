name: ФормыОбратнойСвязи
title: Формы обратной связи
# Описание формы, а не её разметка: поля перечислены реквизитами, вёрстку
# рисует шаблон. Так контент-менеджер меняет подписи и обязательность, не
# трогая HTML.
search_fields: [Наименование, Код]
fields:
  - name: Наименование
    type: string
  - name: Код
    title: Код формы (в адресе)
    type: string
  - name: ЗаголовокФормы
    type: string
  - name: ТекстКнопки
    type: string
  - name: ТекстБлагодарности
    type: string
  - name: ТребоватьТелефон
    type: bool
  - name: Активна
    type: bool

# Без блока activity созданная в интерфейсе запись приходила с пустым флагом,
# то есть неактивной, и молча не показывалась на сайте (#1014).
activity:
  field: Активна
  default_scope: active
  hide_from_choice: true

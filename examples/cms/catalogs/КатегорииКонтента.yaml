name: КатегорииКонтента
title: Категории контента
hierarchical: true
# Рубрики новостей и статей. Иерархия — чтобы «Новости компании» жили внутри
# «Пресс-центра» без второго справочника.
search_fields: [Наименование, Слаг]
fields:
  - name: Наименование
    type: string
  - name: Слаг
    type: string
  - name: Описание
    type: string
  - name: Порядок
    type: number

# Слаг — часть адреса, поэтому дубль означает недостижимую запись: роутер
# отдаёт первую попавшуюся. Уникальность держит индекс, а не модуль записи:
# проверка в коде не спасает от параллельной вставки (#1014).
#
# Слаг обязателен к заполнению: две записи с пустым слагом упрутся в этот же
# индекс. Обязательность реквизита в метаданных выразить пока нечем —
# «fields[].required» загрузчик не понимает (линт помечает ключ неизвестным).
indexes:
  - fields: [Слаг]
    unique: true

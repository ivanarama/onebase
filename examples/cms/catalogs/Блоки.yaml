name: Блоки
title: Блоки
# Переиспользуемые фрагменты разметки: шапка, подвал, баннер. Подставляются в
# макет по коду, поэтому Код обязателен и уникален в пределах сайта.
fields:
  - name: Наименование
    type: string
  - name: КодБлока
    title: Код блока
    type: string
  - name: Сайт
    type: reference:Сайты
  - name: Содержимое
    type: string
  - name: Порядок
    type: number
  - name: Активен
    type: bool

# Без блока activity созданная в интерфейсе запись приходила с пустым флагом,
# то есть неактивной, и молча не показывалась на сайте (#1014).
activity:
  field: Активен
  default_scope: active
  hide_from_choice: true

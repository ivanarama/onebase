name: Товары
title: Товары
hierarchical: true
# Каталог витрины. Тот же контентный контур, что у страниц и новостей — слаг,
# статус, SEO — поэтому роутер и рендер работают с товарами тем же кодом.
search_fields: [Наименование, Артикул, Слаг]
fulltext: [Наименование, Артикул, Описание]
fields:
  - name: Наименование
    type: string
  - name: Артикул
    type: string
  - name: Слаг
    type: string
  - name: Цена
    type: number
  - name: Валюта
    type: string
  - name: Картинка
    type: reference:Медиа
  - name: КартинкаURL
    title: Адрес картинки в источнике
    type: string
  - name: Описание
    type: richtext
  - name: ВнешнийКод
    title: Код в системе-источнике
    type: string
  - name: СтатусПубликации
    type: enum:СтатусПубликации
  - name: ДатаПубликации
    type: date
  - name: ЗаголовокSEO
    title: "SEO: заголовок страницы"
    type: string
  - name: ОписаниеSEO
    title: "SEO: описание для поисковиков"
    type: string
  - name: Сайт
    type: reference:Сайты

# Слаг — часть адреса, поэтому дубль означает недостижимую запись: роутер
# отдаёт первую попавшуюся. Уникальность держит индекс, а не модуль записи:
# проверка в коде не спасает от параллельной вставки (#1014).
#
# Слаг обязателен к заполнению: две записи с пустым слагом упрутся в этот же
# индекс. Обязательность реквизита в метаданных выразить пока нечем —
# «fields[].required» загрузчик не понимает (линт помечает ключ неизвестным).
indexes:
  - fields: [Слаг]
    unique: true

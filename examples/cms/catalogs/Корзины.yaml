name: Корзины
title: Корзины покупателей
# Корзина хранится в базе, а в куке у посетителя лежит только её идентификатор.
# Класть состав корзины в куку нельзя: она подделывается, а вместе с ней и цена.
#
# Своего токена у корзины НЕТ намеренно: им служит UUID самой записи. Генератора
# случайных значений в DSL нет (`УникальныйИдентификатор` — метод ссылки, а не
# фабрика), а UUID записи платформа выдаёт случайный — то есть неподбираемый, и
# ровно один секрет вместо двух, которые пришлось бы держать в согласии.
search_fields: [Наименование]
fields:
  - name: Наименование
    title: Описание корзины
    type: string
  - name: Сайт
    type: reference:Сайты
  - name: Дата
    title: Дата последнего изменения
    type: date
  - name: Оформлена
    type: bool
  # Ссылка на созданный заказ делает повторную отправку формы безопасной:
  # второй POST той же корзины не создаёт второй заказ, а ведёт на первый.
  - name: Заказ
    type: reference:ЗаказПокупателя
tableparts:
  - name: Строки
    fields:
      - name: Товар
        type: reference:Товары
      - name: Количество
        type: number

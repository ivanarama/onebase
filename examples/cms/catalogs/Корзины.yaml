name: Корзины
title: Корзины покупателей
# Корзина хранится в базе, а в куке у посетителя лежит только её идентификатор.
# Класть состав корзины в куку нельзя: она подделывается, а вместе с ней и цена.
#
# Своего токена у корзины НЕТ намеренно: им служит UUID самой записи. Генератора
# случайных значений в DSL нет (`УникальныйИдентификатор` — метод ссылки, а не
# фабрика), а UUID записи платформа выдаёт случайный — то есть неподбираемый, и
# ровно один секрет вместо двух, которые пришлось бы держать в согласии.
search_fields: [Наименование]
fields:
  - name: Наименование
    title: Описание корзины
    type: string
  - name: Сайт
    type: reference:Сайты
  - name: Дата
    title: Дата последнего изменения
    type: date
  - name: Оформлена
    type: bool
  # Ссылка на созданный заказ делает повторную отправку формы безопасной:
  # второй POST той же корзины не создаёт второй заказ, а ведёт на первый.
  - name: Заказ
    type: reference:ЗаказПокупателя
  # Идентификатор того же заказа строкой. Дубль вынужденный: поле-ссылка и в
  # результате запроса, и в табличной части читается ПРЕДСТАВЛЕНИЕМ («ЗС-000001»),
  # а не идентификатором — UUID отдаёт только служебное поле «Ссылка» и метод
  # ссылки УникальныйИдентификатор(). Собирать по представлению адрес заказа
  # нельзя: оно не уникально и меняется вместе с нумерацией.
  - name: ИдЗаказа
    title: Идентификатор заказа (для ссылки)
    type: string
tableparts:
  - name: Строки
    fields:
      # Ссылка — чтобы корзину можно было читать глазами в справочнике…
      - name: Товар
        type: reference:Товары
      # …а идентификатор строкой — чтобы её можно было читать кодом: из
      # табличной части ссылка приходит представлением, и сопоставлять позиции
      # по нему значило бы путать товары с одинаковыми названиями.
      - name: ИдТовара
        title: Идентификатор товара
        type: string
      - name: Количество
        type: number

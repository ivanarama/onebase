name: Страницы
title: Страницы
hierarchical: true
# Статические страницы сайта: «О компании», «Контакты», «Доставка».
# Слаг — адрес страницы, поэтому по нему ищет роутер; уникальность держит
# индекс ниже (двух страниц с одним адресом быть не может — роутер отдал бы
# первую попавшуюся).
search_fields: [Наименование, Слаг, Заголовок]
fulltext: [Наименование, Заголовок, Содержимое]
fields:
  - name: Наименование
    type: string
  - name: Слаг
    title: Адрес страницы (слаг)
    type: string
  - name: Заголовок
    title: Заголовок на странице
    type: string
  - name: Содержимое
    type: richtext
  - name: Обложка
    type: reference:Медиа
  - name: Порядок
    type: number
  # ─── общий контентный контур (см. план 129, решение 4) ───────────────
  - name: СтатусПубликации
    type: enum:СтатусПубликации
  - name: ДатаПубликации
    type: date
  - name: ЗаголовокSEO
    title: "SEO: заголовок страницы"
    type: string
  - name: ОписаниеSEO
    title: "SEO: описание для поисковиков"
    type: string
  - name: OGКартинка
    title: Картинка для соцсетей
    type: reference:Медиа
  - name: Форма
    title: Форма обратной связи на странице
    type: reference:ФормыОбратнойСвязи
  - name: Сайт
    type: reference:Сайты

# Слаг канонизирует модуль объекта, а составной индекс не допускает два
# одинаковых адреса в пределах одного сайта. У разных сайтов один слаг —
# нормальный случай; проверка в коде без индекса не спасла бы от гонки.
#
# Слаг обязателен к заполнению: две записи с пустым слагом упрутся в этот же
# индекс. Обязательность реквизита в метаданных выразить пока нечем —
# «fields[].required» загрузчик не понимает (линт помечает ключ неизвестным).
indexes:
  - fields: [Сайт, Слаг]
    unique: true

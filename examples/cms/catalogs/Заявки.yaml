name: Заявки
title: Заявки с сайта
# Заявка — след обращения посетителя. Хранится всё, что он ввёл, плюс отметка
# «похоже на спам»: удалять подозрительное молча нельзя, живой человек с
# необычным адресом почты не должен исчезать бесследно.
search_fields: [Наименование, Контакт]
fields:
  - name: Наименование
    title: Имя отправителя
    type: string
  - name: Форма
    type: reference:ФормыОбратнойСвязи
  - name: Дата
    type: date
  - name: Контакт
    title: Почта или телефон
    type: string
  - name: Сообщение
    type: string
  - name: Статус
    type: enum:СтатусЗаявки
  - name: Комментарий
    type: string

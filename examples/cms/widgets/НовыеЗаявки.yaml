name: НовыеЗаявки
type: kpi
title: Необработанных заявок
# Заявка со статусом «Спам» в счётчик не идёт: она сохранена, чтобы живой
# человек с необычным адресом не исчез бесследно, но требовать внимания
# ежедневно не должна.
query: |
  ВЫБРАТЬ КОЛИЧЕСТВО(*) КАК Значение
  ИЗ Справочник.Заявки
  ГДЕ Статус = "Новая"

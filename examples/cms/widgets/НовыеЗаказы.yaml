name: НовыеЗаказы
type: kpi
title: Заказов ждёт подтверждения
# В счётчик идут только новые: заказ «в работе» уже у менеджера, а выполненный
# и отменённый требуют внимания не больше, чем прошлогодний.
query: |
  ВЫБРАТЬ КОЛИЧЕСТВО(*) КАК Значение
  ИЗ Документ.ЗаказПокупателя
  ГДЕ Статус = "Новый"

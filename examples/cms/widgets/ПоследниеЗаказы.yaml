name: ПоследниеЗаказы
type: list
title: Заказы с сайта
query: |
  ВЫБРАТЬ Ссылка, Дата, Номер, Наименование, Контакт, Сумма, Статус
  ИЗ Документ.ЗаказПокупателя
  УПОРЯДОЧИТЬ ПО Дата УБЫВ
source:
  entity: ЗаказПокупателя
  id_field: Ссылка
refresh_on: [данные.заказпокупателя]
limit: 10
columns:
  - field: Дата
    label: Дата
    format: date
  - field: Номер
    label: Номер
  - field: Наименование
    label: Покупатель
  - field: Контакт
    label: Контакт
  - field: Сумма
    label: Сумма
  - field: Статус
    label: Статус

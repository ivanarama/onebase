name: ПоследниеЗаявки
type: list
title: Заявки с сайта
query: |
  ВЫБРАТЬ Дата, Наименование, Контакт, Форма.Наименование КАК Форма, Статус
  ИЗ Справочник.Заявки
  УПОРЯДОЧИТЬ ПО Дата УБЫВ
limit: 10
columns:
  - field: Дата
    label: Дата
    format: date
  - field: Наименование
    label: Кто написал
  - field: Контакт
    label: Контакт
  - field: Статус
    label: Статус

title: Управление сайтом
layout: rows
# Первая строка — то, ради чего сюда заходят каждый день: посмотреть сайт и
# добавить материал. Счётчик заявок рядом, потому что необработанная заявка —
# единственное, что на этом рабочем столе требует срочного действия.
rows:
  - widgets:
      - ОткрытьСайт
      - НовыеЗаказы
      - НовыеЗаявки
  - widgets:
      - ДобавитьКонтент
  # Заказы идут выше заявок: заявка — это просьба перезвонить, а заказ —
  # собранная корзина с суммой, и ждать он должен меньше.
  - widgets:
      - ПоследниеЗаказы
  - widgets:
      - ПоследниеЗаявки
      - ПоследниеПубликации

name: РедакторСайта
description: Контент плюс оформление, маршруты и редиректы
permissions:
  catalogs:
    Сайты: [read, write]
    СтилиСайта: [read, write]
    ШаблоныСайта: [read, write]
    Блоки: [read, write]
    Страницы: [read, write]
    Новости: [read, write]
    КатегорииКонтента: [read, write]
    Медиа: [read, write]
    Меню: [read, write]
    МаршрутыURL: [read, write]
    Редиректы: [read, write]
    Заявки: [read, write]
    ФормыОбратнойСвязи: [read, write]
    Товары: [read, write]
    # Корзины — служебный след посетителей, а не контент. Право на чтение
    # выдано ради разбора жалоб «положил в корзину, а заказ не оформился»;
    # права на запись нет намеренно — корзину ведёт сайт, а не человек.
    Корзины: [read]
  documents:
    # Проведения у заказа нет, поэтому post/unpost в списке отсутствуют:
    # выдавать право на действие, которого у документа нет, — обещание, которое
    # некому исполнить.
    ЗаказПокупателя: [read, write]
  # Список явный по той же причине, что и у контент-менеджера: роль без секции
  # processors разрешает все обработки, включая тесты конфигурации. Редактору
  # добавлено демо-заполнение — оно создаёт сайт, стиль, шаблон и маршруты,
  # то есть ровно то, чем эта роль и отличается.
  processors:
    ИмпортИзYML: [run]
    ЗаполнитьТестовуюБазу: [run]

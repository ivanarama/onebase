name: КонтентМенеджер
description: Наполнение сайта контентом без доступа к оформлению и настройкам
# Оформление (стили, шаблоны, блоки) и структура адресов намеренно недоступны:
# ошибка в макете или в маршруте ломает сайт целиком, а тексты правятся
# ежедневно. Сайты видны только на чтение — чтобы выбирать, к какому сайту
# относится материал.
permissions:
  catalogs:
    Сайты: [read]
    Страницы: [read, write]
    Новости: [read, write]
    КатегорииКонтента: [read, write]
    Медиа: [read, write]
    Меню: [read, write]
    Заявки: [read, write]
    ФормыОбратнойСвязи: [read]
    Товары: [read, write]
  # Секция обязана быть, даже когда разрешена одна обработка: роль БЕЗ неё
  # разрешает ВСЕ обработки разом (auth/roles.go — nil означает «нет
  # ограничений»). Импорт каталога ходит в сеть за картинками, и попадать в этот
  # список молча, «потому что секцию забыли», такой обработке нельзя.
  # Демо-заполнение и тесты конфигурации остаются администратору.
  processors:
    ИмпортИзYML: [run]

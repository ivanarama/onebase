name: Руководитель
permissions:
  catalogs:
    ВидДеятельности: [read, write]
    Исполнитель: [read, write]
    Механизм: [read, write]
    ОбъектМетаданных: [read, write]
    Очередь: [read, write]
    Подсистема: [read, write]
    ПравилоПроверки: [read, write]
    Проект: [read, write]
    ПрофильПользователя: [read, write]
    Роль: [read, write]
    Сценарий: [read, write]
    Функция: [read, write]
  documents:
    Задача: [read, write, post, unpost]
    Комментарий: [read, write]
    Ошибка: [read, write, post, unpost]
    ПубликацияПравила: [read, write, post, unpost]
    УчётВремени: [read, write]
  inforegs:

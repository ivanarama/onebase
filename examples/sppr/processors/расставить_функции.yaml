# Шаг проектировщика после моста: импортированные объекты получают функцию.
# Без параметра «Пары» обрабатываются зашитые пары узлов каркаса (4.x);
# с параметром — пары целевого проекта: «кодфункции=имя:тип;имя:тип»,
# разделитель записей «|».
name: РасставитьФункции
params:
  - label: Пары закрепления (кодфункции=имя:тип;…|…)
    name: Пары
    type: string
title: Расставить функции по импортированному описанию

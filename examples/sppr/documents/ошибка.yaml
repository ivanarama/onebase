fulltext: [Заголовок, Описание]
# Ошибка как объект проектирования: фиксируется отклонение от проектных
# правил (результат аудита или тестов) и связывается с функцией/объектом.
# Цикл: Зарегистрирована → НаРассмотрении → ВРаботе → Исправлена → Проверена;
# Возвращена — повторное открытие, Отменена — не подтверждена.
name: Ошибка
numerator:
  length: 6
  period: year
  prefix: "ERR-"
stages:
  deadline_days: {ВРаботе: 10, НаРассмотрении: 3}
  enforce: strict
  field: Статус
  order: [Зарегистрирована, НаРассмотрении, ВРаботе, Исправлена, Проверена, Возвращена, Отменена]
  transitions:
    - {from: Зарегистрирована, to: [НаРассмотрении, Отменена]}
    - {from: НаРассмотрении, to: [ВРаботе, Отменена]}
    - {from: ВРаботе, to: [Исправлена]}
    - {from: Исправлена, to: [Проверена, Возвращена]}
    - {from: Возвращена, to: [НаРассмотрении]}
    - {from: Отменена, to: [Зарегистрирована]}
title: Ошибка

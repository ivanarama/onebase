fields:
  - name: Номер
    type: string
  - name: Дата
    type: date
  - name: Заголовок
    type: string
  - name: Описание
    type: string
  - name: Проект
    type: reference:Проект
  - name: Функция
    type: reference:Функция
  - name: Объект
    type: reference:ОбъектМетаданных
  - name: Статус
    type: enum:СтатусОшибки
  - name: Приоритет
    type: enum:Приоритет
  - name: Автор
    type: string
  - name: Ответственный
    type: reference:Исполнитель
  - name: Задача
    type: reference:Задача
  - name: Сценарий
    type: reference:Сценарий
  - name: Решение

# Реестр шагов сценариев Gherkin каркаса: текст шага → DSL каркаса.
# Компилирует `onebase gherkin compile --project examples/sppr`.
шаги:
  - код: |
      Пр = Справочники.Проект.Создать()
      Пр.Наименование = <Проект>
      ПроектСсылка = Пр.Записать()
    тип: действие
    шаг: "заведён проект «<Проект>»"
  - код: |
      Ф = Справочники.Функция.Создать()
      Ф.Код = <Код>
      Ф.Наименование = "функция " + <Код>
      Ф.Проект = ПроектСсылка
      Ф.Статус = "Черновик"
      ФункцияСсылка = Ф.Записать()
    тип: действие
    шаг: "заведена функция с кодом «<Код>»"
  - код: |
      Об = Справочники.ОбъектМетаданных.Создать()
      Об.Имя = <Имя>
      Об.Тип = <Тип>
      Об.Проект = ПроектСсылка
      Об.Контроль = "НеПроверено"
      ОбъектСсылка = Об.Записать()
    тип: действие
    шаг: "заведён объект метаданных «<Имя>» типа «<Тип>»"
  - код: |
      ФункцияСсылка = Справочники.Функция.НайтиПоРеквизиту("Код", <Код>)
      ОбъектСсылка = Справочники.ОбъектМетаданных.НайтиПоРеквизиту("Имя", <Имя>)
      Об = ОбъектСсылка.ПолучитьОбъект()
      Об.Функция = ФункцияСсылка
      Об.Записать()
      Мен = РегистрыСведений.Трассировка.СоздатьМенеджерЗаписи()
      Мен.Функция = ФункцияСсылка
      Мен.Объект = ОбъектСсылка
      Мен.ПутьФайла = <Имя>
      Мен.Записать()
    тип: действие
    шаг: "объект «<Имя>» закреплён за функцией с кодом «<Код>»"
  - выражение: КодОбъекта
    вычисление: |
      З = Новый Запрос
      З.Текст = "ВЫБРАТЬ ПЕРВЫЕ 1 О.Функция.Код КАК Код ИЗ Справочник.ОбъектМетаданных КАК О ГДЕ О.Имя = <Имя>"
      КодОбъекта = ""
      Для Каждого Стр Из З.Выполнить() Цикл
          КодОбъекта = Стр.Код
      КонецЦикла
    ожидание: <Код>
    проверка: Равно
    тип: проверка
    шаг: "функция объекта «<Имя>» имеет код «<Код>»"
  - выражение: Н > 0
    вычисление: |
      З = Новый Запрос
      З.Текст = "ВЫБРАТЬ КОЛИЧЕСТВО(*) КАК Н ИЗ РегистрСведений.Трассировка.СрезПоследних(&Д) КАК Т ГДЕ Т.Функция.Код = <Код> И Т.Объект.Имя = <Имя>"
      З.УстановитьПараметр("Д", ТекущаяДата() + 86400 * 30)
      Н = 0
      Для Каждого Стр Из З.Выполнить() Цикл
          Н = Стр.Н
      КонецЦикла
    проверка: Истина
    тип: проверка
    шаг: "трассировка содержит запись функции «<Код>» для объекта «<Имя>»"
  - код: |
      Наполнение.ЗавестиДеревоИзСписка(<Узлы>, ПроектСсылка)
    тип: действие
    шаг: "по списку узлов «<Узлы>» заведено дерево функций"
  - код: |
      JSON = "[{""код"":""0"",""наименование"":""Понимание_текста"",""родитель"":"""",""результат"":""ответ"",""трудозатраты"":2},"
      + "{""код"":""1"",""наименование"":""Приём_данных"",""родитель"":""0"",""результат"":""данные"",""трудозатраты"":1}]"
      Наполнение.ЗавестиДеревоИзJSON(JSON, Наполнение.НайтиИлиСоздатьПроект("compsem-тест"))
    тип: действие
    шаг: "JSON-текстом заведено дерево узлов 0 и 1"
  - код: |
      Наполнение.ЗавестиДеревоИзСписка(<Узлы>, Наполнение.НайтиИлиСоздатьПроект(<Проект>))
    тип: действие
    шаг: "по списку узлов «<Узлы>» заведено дерево для проекта «<Проект>»"
  - выражение: СтатусВПроекте
    вычисление: |
      З = Новый Запрос
      З.Текст = "ВЫБРАТЬ ПЕРВЫЕ 1 Ф.Статус КАК Статус ИЗ Справочник.Функция КАК Ф ГДЕ Ф.Код = &Код И Ф.Проект.Наименование = &Проект"
      З.УстановитьПараметр("Код", <Код>)
      З.УстановитьПараметр("Проект", <Проект>)
      СтатусВПроекте = ""
      Для Каждого Стр Из З.Выполнить() Цикл
          СтатусВПроекте = Стр.Статус
      КонецЦикла
    ожидание: <Статус>
    проверка: Равно
    тип: проверка
    шаг: "функция с кодом «<Код>» проекта «<Проект>» имеет статус «<Статус>»"
  - выражение: КодФункции
    вычисление: |
      З = Новый Запрос
      З.Текст = "ВЫБРАТЬ ПЕРВЫЕ 1 Ф.Статус КАК Статус ИЗ Справочник.Функция КАК Ф ГДЕ Ф.Код = &Код"
      З.УстановитьПараметр("Код", <Код>)
      КодФункции = ""
      Для Каждого Стр Из З.Выполнить() Цикл
          КодФункции = Стр.Статус
      КонецЦикла
    ожидание: <Статус>
    проверка: Равно
    тип: проверка
    шаг: "функция с кодом «<Код>» имеет статус «<Статус>»"
  - выражение: РезультатФункции
    вычисление: |
      З = Новый Запрос
      З.Текст = "ВЫБРАТЬ ПЕРВЫЕ 1 Ф.Результат КАК Результат ИЗ Справочник.Функция КАК Ф ГДЕ Ф.Код = &Код"
      З.УстановитьПараметр("Код", <Код>)
      РезультатФункции = ""
      Для Каждого Стр Из З.Выполнить() Цикл
          РезультатФункции = Стр.Результат
      КонецЦикла
    ожидание: <Результат>
    проверка: Равно
    тип: проверка
    шаг: "функция с кодом «<Код>» имеет результат «<Результат>»"
  - выражение: ИмяПроекта
    вычисление: |
      З = Новый Запрос
      З.Текст = "ВЫБРАТЬ ПЕРВЫЕ 1 Ф.Проект.Наименование КАК Проект ИЗ Справочник.Функция КАК Ф ГДЕ Ф.Код = &Код"
      З.УстановитьПараметр("Код", <Код>)
      ИмяПроекта = ""
      Для Каждого Стр Из З.Выполнить() Цикл
          ИмяПроекта = Стр.Проект
      КонецЦикла
    ожидание: <Проект>
    проверка: Равно
    тип: проверка
    шаг: "функция с кодом «<Код>» относится к проекту «<Проект>»"
  - код: |
      Наполнение.РасставитьПоСписку(<Пары>)
    тип: действие
    шаг: "по парам «<Пары>» объекты закреплены"
  - код: |
      Наполнение.ЗаписатьСвязиПоСписку(<Список>)
    тип: действие
    шаг: "по списку «<Список>» записаны связи функций"
  - выражение: Н > 0
    вычисление: |
      З = Новый Запрос
      З.Текст = "ВЫБРАТЬ КОЛИЧЕСТВО(*) КАК Н ИЗ РегистрСведений.СвязиФункций КАК С ГДЕ С.Потребитель.Код = &Потребитель И С.Источник.Код = &Источник И С.Вид = &Вид"
      З.УстановитьПараметр("Потребитель", <Потребитель>)
      З.УстановитьПараметр("Источник", <Источник>)
      З.УстановитьПараметр("Вид", <Вид>)
      Н = 0
      Для Каждого Стр Из З.Выполнить() Цикл
          Н = Стр.Н
      КонецЦикла
    проверка: Истина
    тип: проверка
    шаг: "связь функции «<Потребитель>» имеет источник с кодом «<Источник>» вида «<Вид>»"

# История переходов статусов задач пишется модулем документа ПриЗаписи:
# платформенная история этапов (план 121) показывает переходы по маршруту,
# а здесь — автор, комментарий и старый статус для отчётов.
# Ключ записи — задача + номер перехода: записи одного прогона идут в одну
# секунду, и без номера строки предыдущего перехода затирались бы.
dimensions:
  - name: Задача
    type: reference:Задача
  - name: Переход
    type: number
indexes:
  - fields: [Задача, Переход]
name: ИсторияСтатусовЗадач
periodic: true
resources:
  - name: СтарыйСтатус
    type: enum:СтатусЗадачи
  - name: НовыйСтатус
    type: enum:СтатусЗадачи
  - name: Исполнитель
    type: string
  - name: Комментарий
    type: string
title: История статусов задач

fulltext: [Наименование, Триггер, Начало, Завершение, Описание]
# Автоматизируемые процессы ТЗ §1: триггер, начало, завершение и шаги.
# Аудит проверяет «процесс без функций» — процесс без единого шага с
# ссылкой на функцию каркаса.

# Дерево функций проектируемого решения. Иерархия даёт родительский контекст
# декомпозиции, код — нумерацию вида 1.2.3, статус — маршрут согласования
# (функция утверждается только после тестового сценария).
hierarchical: true
name: Функция
stages:
  deadline_days: {НаСогласовании: 5}
  enforce: strict
  field: Статус
  order: [Черновик, НаСогласовании, Утверждена, Отменена]
  transitions:
    - {from: Черновик, to: [НаСогласовании]}
    - {from: НаСогласовании, to: [Утверждена, Отменена]}
    - {from: Отменена, to: [Черновик]}

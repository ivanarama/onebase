name: ЗадачиПоИсполнителям
params:
  - label: Проект
    name: Проект
    type: reference:Проект
query: |
  ВЫБРАТЬ
    З.Исполнитель.Наименование КАК Исполнитель,
    З.Статус,
    КОЛИЧЕСТВО(*) КАК Задач
  ИЗ Документ.Задача КАК З
  ГДЕ (&Проект ЕСТЬ ПУСТО ИЛИ З.Проект = &Проект)
  СГРУППИРОВАТЬ ПО З.Исполнитель.Наименование, З.Статус
  УПОРЯДОЧИТЬ ПО З.Исполнитель.Наименование, З.Статус
title: Задачи по исполнителям

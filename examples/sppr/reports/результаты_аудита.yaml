    name: НаДату
    type: date
query: |
  ВЫБРАТЬ
    П.Код,
    Р.Важность,
    Р.ТипОбъекта,
    Р.Объект,
    Р.Информация
  ИЗ РегистрСведений.РезультатыПроверки.СрезПоследних(&НаДату) КАК Р

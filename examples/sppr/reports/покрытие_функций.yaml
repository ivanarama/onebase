# Функции, у которых нет объектов метаданных или тестового сценария:
# покрытие модели реализацией и подтверждениями.
# Счёт идёт РАЗЛИЧными ссылками: функция, соединённая с объектами и
# сценариями одним запросом, даёт произведение строк, и обычный
# КОЛИЧЕСТВО() пересчитал бы каждую пару «объект × сценарий».
name: ПокрытиеФункций
params:
  - label: Проект
    name: Проект
    type: reference:Проект
query: |
  ВЫБРАТЬ
    Ф.Код,
    Ф.Наименование,
    Ф.Статус,
    КОЛИЧЕСТВО(РАЗЛИЧНЫЕ О.Ссылка) КАК Объектов,
    КОЛИЧЕСТВО(РАЗЛИЧНЫЕ С.Ссылка) КАК Сценариев,
    КОЛИЧЕСТВО(РАЗЛИЧНЫЕ З.Ссылка) КАК Задач
  ИЗ Справочник.Функция КАК Ф
    ЛЕВОЕ СОЕДИНЕНИЕ Справочник.ОбъектМетаданных КАК О ПО О.Функция = Ф.Ссылка
    ЛЕВОЕ СОЕДИНЕНИЕ Справочник.Сценарий КАК С ПО С.Функция = Ф.Ссылка
    ЛЕВОЕ СОЕДИНЕНИЕ Документ.Задача КАК З ПО З.Функция = Ф.Ссылка
  ГДЕ (&Проект ЕСТЬ ПУСТО ИЛИ Ф.Проект = &Проект)
  СГРУППИРОВАТЬ ПО Ф.Код, Ф.Наименование, Ф.Статус
  УПОРЯДОЧИТЬ ПО Ф.Код
title: Покрытие функций

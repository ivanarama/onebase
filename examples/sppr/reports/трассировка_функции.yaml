name: ТрассировкаФункции
params:
  - label: Функция
    name: Функция
    type: reference:Функция
query: |
  ВЫБРАТЬ
    Ф.Код,
    Ф.Наименование,
    О.Имя,
    О.Тип,
    Т.ПутьФайла,
    Т.Коммит,
    З.Заголовок
  ИЗ РегистрСведений.Трассировка КАК Т
    ВНУТРЕННЕЕ СОЕДИНЕНИЕ Справочник.Функция КАК Ф ПО Т.Функция = Ф.Ссылка
    ЛЕВОЕ СОЕДИНЕНИЕ Справочник.ОбъектМетаданных КАК О ПО Т.Объект = О.Ссылка
    ЛЕВОЕ СОЕДИНЕНИЕ Документ.Задача КАК З ПО Т.Задача = З.Ссылка
  ГДЕ (&Функция ЕСТЬ ПУСТО ИЛИ Т.Функция = &Функция)
  УПОРЯДОЧИТЬ ПО Ф.Код, О.Имя
title: Трассировка функции

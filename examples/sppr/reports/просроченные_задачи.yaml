name: ПросроченныеЗадачи
params:
  - default: "{{today}}"
    label: На дату
    name: НаДату
    type: date
query: |
  ВЫБРАТЬ
    З.Номер,
    З.Заголовок,
    З.Статус,
    З.Исполнитель.Наименование КАК Исполнитель,
    З.Срок,
    З.Приоритет
  ИЗ Документ.Задача КАК З
  ГДЕ З.Срок НЕ ЕСТЬ ПУСТО И З.Срок < &НаДату
    И З.Статус <> 'Выполнена' И З.Статус <> 'Отменена'
  УПОРЯДОЧИТЬ ПО З.Срок
title: Просроченные задачи

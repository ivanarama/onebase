# Реестр шагов Gherkin compsem: текст шага → DSL проекта.
# Компилирует `onebase gherkin compile --project examples/compsem`.
шаги:
  - код: |
      ПоставкаПравил = "frame" + Символы.Таб + "КУПИТЬ" + Символы.Таб + "Глаг" + Символы.Таб + "КЛ_Владение" + Символы.Таб
          + "у+Сущ.Род:владелец,Сущ.Вин.КЛ_Товар:объект" + Символы.Таб
          + "купить_1.СВ_Объект=#" + Символы.Таб
          + "владелец{Род,у,1};объект{Вин,,2}" + Символы.Таб
          + "" + Символы.Таб + "один" + Символы.ПС
          + "вопрос" + Символы.Таб + "ГДЕ" + Символы.Таб + "Нареч" + Символы.Таб + "КЛ_Локация" + Символы.Таб
          + "Сущ.Пред:локация" + Символы.Таб
          + "локация.СВ_Место=#" + Символы.Таб
          + "локация{Пред,,1}" + Символы.Таб
          + "" + Символы.Таб + "один"
    тип: действие
    шаг: "поставка правил из двух строк"
  - код: |
      ПоставкаПравил = "# комментарий" + Символы.ПС + "КУПИТЬ Глаг КЛ_Владение"
    тип: действие
    шаг: "поставка правила без колонок"
  - код: |
      Попытка
          Знание.ПрименитьПравила(ПоставкаПравил, <Версия>)
          ОтказЗагрузки = ""
      Исключение
          ОтказЗагрузки = "отказ"
      КонецПопытки
    тип: действие
    шаг: "загружено знание версии <Версия>"
  - выражение: ВидПравила
    тип: проверка
    шаг: "правило «<Код>» имеет вид «<Вид>»"
    вычисление: |
      П = Справочники.Правила.НайтиПоКоду(<Код>)
      ВидПравила = ?(ЗначениеЗаполнено(П), ЗначениеРеквизитаОбъекта(П, "Вид"), "")
    ожидание: <Вид>
    проверка: Равно
  - выражение: ПозицияПравила
    тип: проверка
    шаг: "позиция <Порядок> правила «<Код>» роль «<Роль>» падеж «<Падеж>» предлог «<Предлог>»"
    вычисление: |
      П = Справочники.Правила.НайтиПоКоду(<Код>)
      З = Новый Запрос
      З.Текст = "ВЫБРАТЬ ПЕРВЫЕ 1 Р.Роль, Р.Падеж, Р.Предлог ИЗ РегистрСведений.Позиции_правил КАК Р ГДЕ Р.Правило = &П И Р.Порядок = &Порядок"
      З.УстановитьПараметр("П", П)
      З.УстановитьПараметр("Порядок", ?(ПустаяСтрока(<Порядок>), 1, Число(<Порядок>)))
      ПозицияПравила = ""
      Для Каждого Стр Из З.Выполнить() Цикл
          ПозицияПравила = Стр.Роль + "." + Стр.Падеж + "." + Стр.Предлог
      КонецЦикла
    ожидание: <Роль> + "." + <Падеж> + "." + <Предлог>
    проверка: Равно
  - код: |
      ПроверокРолей = ПроверокРолей + 1
      Утверждать.РольНеМожет(<Роль>, "справочник", <Объект>, "write", "роль «" + <Роль> + "» не может писать справочник «" + <Объект> + "»")
    тип: действие
    шаг: "роль «<Роль>» не может писать справочник «<Объект>»"
  - код: |
      ПроверокРолей = ПроверокРолей + 1
      Утверждать.РольМожет(<Роль>, "справочник", <Объект>, "read", "роль «" + <Роль> + "» может читать справочник «" + <Объект> + "»")
    тип: действие
    шаг: "роль «<Роль>» может читать справочник «<Объект>»"
  - код: |
      ПроверокРолей = ПроверокРолей + 1
      Утверждать.РольМожет(<Роль>, "справочник", <Объект>, "write", "роль «" + <Роль> + "» может писать справочник «" + <Объект> + "»")
    тип: действие
    шаг: "роль «<Роль>» может писать справочник «<Объект>»"
  - код: |
      ПроверокРолей = 0
    тип: действие
    шаг: "подготовлен счётчик проверок ролей"
  - выражение: ПроверокРолей
    тип: проверка
    шаг: "проверено <Число> прав ролей"
    вычисление: |
      // Счётчик обязан совпасть с числом шагов: ассерт, который не вызван,
      // проверку роли не доказывает.
    ожидание: <Число>
    проверка: Равно
  - код: |
      Д = Документы.Текст.Создать();
      Д.Номер = "TEXT-1";
      Д.ИсходныйТекст = <Текст>;
      Д.Источник = <Источник>;
      Д.Статус = "Новая";
      ТекстСсылка = Д.Записать();
    тип: действие
    шаг: "текст «<Текст>» с источником «<Источник>»"
  - код: |
      ТекстСсылка.ПолучитьОбъект().Провести()
    тип: действие
    шаг: "текст проведён"
  - выражение: СобытияЛенты
    тип: проверка
    шаг: "лента содержит <Число> событий"
    вычисление: |
      З = Новый Запрос
      З.Текст = "ВЫБРАТЬ КОЛИЧЕСТВО(*) КАК Н ИЗ РегистрСведений.Лента_событий.СрезПоследних(&Т) КАК Л"
      З.УстановитьПараметр("Т", ТекстСсылка)
      СобытияЛенты = 0
      Для Каждого Стр Из З.Выполнить() Цикл
          СобытияЛенты = Стр.Н
      КонецЦикла
    ожидание: <Число>
    проверка: Равно
  - выражение: ЗначениеСобытия
    тип: проверка
    шаг: "событие <Момент> ленты имеет значение «<Значение>»"
    вычисление: |
      // Срез последних отдаёт измерения; ресурс строки читается менеджером
      // записи по ключу измерений — срез ресурсов запросом не покрыт (план 222 §4).
      З = РегистрыСведений.Лента_событий.СоздатьМенеджерЗаписи()
      З.Текст = ТекстСсылка
      З.Момент = Число(<Момент>)
      З.Экземпляр = "Предложение_" + Число(<Момент>)
      З.Свойство = Справочники.Свойства.НайтиПоКоду("—")
      З.Прочитать()
      ЗначениеСобытия = ?(З.Выбран(), З.Значение, "")
    ожидание: <Значение>
    проверка: Равно
  - выражение: ИсточникСобытия
    тип: проверка
    шаг: "событие <Момент> ленты имеет источник «<Источник>»"
    вычисление: |
      З = РегистрыСведений.Лента_событий.СоздатьМенеджерЗаписи()
      З.Текст = ТекстСсылка
      З.Момент = Число(<Момент>)
      З.Экземпляр = "Предложение_" + Число(<Момент>)
      З.Свойство = Справочники.Свойства.НайтиПоКоду("—")
      З.Прочитать()
      ИсточникСобытия = ?(З.Выбран(), З.Источник, "")
    ожидание: <Источник>
    проверка: Равно
  - выражение: ОтказЗагрузки
    тип: проверка
    шаг: "загрузка знания отвергнута"
    вычисление: |
      // Отказ обязан остаться признаком отказа, а не текстом ошибки:
      // загрузка, которая не отвергла кривую строку, тест не проходит.
      ОтказЗагрузки = ОтказЗагрузки = "отказ"
    проверка: Истина

  - код: |
      ПоставкаСлов = "<Слово>" + Символы.Таб + "Сущ" + Символы.Таб + "КЛ_Человек" + Символы.Таб + "<Парадигма>"
      ПоставкаПарадигм = "<Парадигма> Сущ <Слово> Им.Един=<Слово> Род.Един=человека"
    тип: действие
    шаг: "поставка слов «<Слово>» с парадигмой «<Парадигма>»"
  - код: |
      Знание.ПрименитьСловарь(ПоставкаСлов, ПоставкаПарадигм, <Версия>)
    тип: действие
    шаг: "загружен словарь версии <Версия>"
  - выражение: КлассФормы
    тип: проверка
    шаг: "форма «<Форма>» даёт класс «<КЛ>»"
    вычисление: |
      З = РегистрыСведений.Формы_лексикона.СоздатьМенеджерЗаписи()
      З.Форма = <Форма>
      З.Прочитать()
      КлассФормы = ?(З.Выбран(), ЗначениеРеквизитаОбъекта(З.Класс, "Код"), "")
    ожидание: <КЛ>
    проверка: Равно
  - выражение: ФормаЕсть
    тип: проверка
    шаг: "слова «<Форма>» в словаре нет"
    вычисление: |
      З = РегистрыСведений.Формы_лексикона.СоздатьМенеджерЗаписи()
      З.Форма = <Форма>
      З.Прочитать()
      ФормаЕсть = З.Выбран()
    проверка: Ложь

name: РеализацияТоваров
title: Реализация товаров
posting: true
numerator:
  prefix: "РТ-"
  length: 6
  period: year
fields:
  - name: Номер
    type: string
  - name: Дата
    type: date
    # Значения по умолчанию (план 153): подставляются при создании нового
    # документа — из формы, из DSL (Документы.X.Создать()) и по REST.
    default: сейчас
  - name: Организация
    type: reference:Организация
    default: константа.НашаОрганизация
  - name: Покупатель
    type: reference:Контрагент
  - name: Склад
    type: reference:Склад
    # Единственный доступный элемент справочника, иначе поле пустое.
    default: единственный
  - name: СпособУчетаНДС
    type: enum:СпособУчетаНДС
  - name: СуммаБезНДС
    type: number
  - name: СуммаНДС
    type: number
  - name: Сумма
    type: number
  - name: Комментарий
    type: string
tableparts:
  - name: Товары
    fields:
      - name: Номенклатура
        type: reference:Номенклатура
      - name: Количество
        type: number
      - name: Цена
        type: number
      - name: СтавкаНДС
        type: reference:СтавкаНДС
      - name: СуммаНДС
        type: number
      - name: Сумма
        type: number
      - name: Себестоимость
        type: number

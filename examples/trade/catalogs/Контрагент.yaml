name: Контрагент
title: Контрагент
# Код выдаётся платформой и обязан быть уникальным: контрагент с чужим кодом
# ломает сверку с внешними системами и обмен между базами. Поле «Код»
# синтезируется — объявлять его в fields: не нужно.
#
# Существующие элементы после включения нумератора остаются без кода: правка
# конфигурации не переписывает данные молча. Дозаполнить — onebase renumber
# --project . --sqlite <база> --write (без --write команда только покажет объём).
numerator:
  prefix: "К-"
  length: 6
  unique: true
fields:
  - name: Наименование
    type: string
  - name: ПолноеНаименование
    type: string
  - name: Вид
    type: enum:ВидКонтрагента
  - name: ИНН
    type: string
  - name: Телефон
    type: string
  - name: Email
    type: string
  - name: Адрес
    type: string
  - name: РасчётныйСчёт
    type: string
  - name: Банк
    type: string
  - name: БИК
    type: string
  - name: КонтактноеЛицо
    type: string
  - name: Комментарий
    type: string

name: ОбменСУзлом
title: Обмен с узлом (исполняется из очереди)
# Расписания у задания нет намеренно: задачи ему ставит очередь
# (ФоновыеЗадания.Поставить), а не cron. Валидное выражение здесь обязательно —
# оно просто никогда не тикает, потому что enabled: false.
schedule: "@every 24h"
processor: ОбменСУзлом
enabled: false
on_error: continue
# Таймаут задания становится пределом исполнения ОДНОЙ задачи очереди.
timeout: 120

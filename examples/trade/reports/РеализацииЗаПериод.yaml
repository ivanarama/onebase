name: РеализацииЗаПериод
title: Реализации за период (дата и время)
params:
  - name: НачалоПериода
    type: datetime
    label: С момента
    default: "{{now | minus_hours:6}}"
  - name: КонецПериода
    type: datetime
    label: По момент
    default: "{{now}}"
query: |
  ВЫБРАТЬ Номер, Дата, Покупатель, Сумма
  ИЗ Документ.РеализацияТоваров
  ГДЕ Дата >= &НачалоПериода И Дата <= &КонецПериода
  УПОРЯДОЧИТЬ ПО Дата УБЫВ

schema: onebase.form/v1
form:
  name: ФормаОбъекта
  kind: object
  entity: ЗаказПокупателя
  title:
    ru: "Заказ покупателя"
    en: "Customer order"
  auto_save_settings: true
attributes:
  - name: Объект
    type: DocumentRef.ЗаказПокупателя
    save: true
    main: true
elements:
  - kind: СтраницыФормы
    name: ОсновныеЗакладки
    children:
      - kind: Страница
        name: СтраницаОсновное
        title:
          ru: "Основное"
        children:
          - kind: ГруппаФормы
            name: ГруппаШапка
            title:
              ru: "Реквизиты заказа"
            children:
              - kind: ПолеВвода
                name: ПолеНомер
                title:
                  ru: "Номер"
                data_path: Объект.Номер
                readonly: true
              - kind: ПолеВвода
                name: ПолеДата
                title:
                  ru: "Дата"
                data_path: Объект.Дата
                required: true
              - kind: ПолеВвода
                name: ПолеОрганизация
                title:
                  ru: "Организация"
                data_path: Объект.Организация
                required: true
              - kind: ПолеВвода
                name: ПолеПокупатель
                title:
                  ru: "Покупатель"
                data_path: Объект.Покупатель
                required: true
                choice: true
              - kind: ПолеВвода
                name: ПолеСклад
                title:
                  ru: "Склад"
                data_path: Объект.Склад
                required: true
                choice: true
              - kind: ПолеВвода
                name: ПолеСтатус
                title:
                  ru: "Статус"
                data_path: Объект.Статус
                choice: true
              - kind: ПолеВвода
                name: ПолеДатаОтгрузки
                title:
                  ru: "Дата отгрузки"
                data_path: Объект.ДатаОтгрузки
      - kind: Страница
        name: СтраницаТовары
        title:
          ru: "Товары"
        children:
          - kind: ТабличнаяЧасть
            name: ТабТовары
            title:
              ru: "Товары"
            data_path: Объект.Товары
            auto_sum: true
            # Состав и порядок колонок задаются явно (план 154). Перечислены
            # все реквизиты: невыбранный не исчезает из документа, он лишь
            # перестаёт показываться — убрать колонку с формы и продолжать
            # заполнять реквизит проведением вполне законно.
            children:
              - kind: Колонка
                name: КолНоменклатура
                data_path: Объект.Товары.Номенклатура
              - kind: Колонка
                name: КолКоличество
                data_path: Объект.Товары.Количество
                # Событие своей колонки: срабатывает на правку ИМЕННО этой
                # ячейки, обработчик всей табличной части при этом не
                # отключается.
                events:
                  ПриИзменении: КоличествоПриИзменении
              - kind: Колонка
                name: КолЦена
                data_path: Объект.Товары.Цена
              - kind: Колонка
                name: КолСумма
                data_path: Объект.Товары.Сумма
              - kind: Колонка
                name: КолРезерв
                data_path: Объект.Товары.Резерв
          - kind: ГруппаФормы
            name: ГруппаИтоги
            title:
              ru: "Итого"
            children:
              - kind: ПолеВвода
                name: ПолеСумма
                title:
                  ru: "Сумма заказа"
                data_path: Объект.Сумма
                readonly: true
          - kind: ПолеВвода
            name: ПолеКомментарий
            title:
              ru: "Комментарий"
            data_path: Объект.Комментарий
events:
  ПриОткрытии: ПриОткрытииФормы
  ПередЗаписью: ПередЗаписьюФормы

name: СотрудникНабор
description: Ордера набора филиалов одной карточки; карточки изменяет администратор
permissions:
  processors: {}
  documents:
    Ордер: [read, write, delete, post, unpost]
  row_access:
    documents:
      Ордер:
        read:
          field: Филиал
          op: in
          value:
            user_card:
              catalog: Сотрудник
              account_field: Учётка
              table_part: Филиалы
              column: Филиал
        write: {same_as: read}
        delete: {same_as: read}
        post: {same_as: read}
        unpost: {same_as: read}
